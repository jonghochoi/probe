<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>연구 축 조율실</title>
<style>
:root { --bg: #f6f6fb; --panel: #ffffff; --ink: #1d1f2e; --muted: #6a6d82; --line: #e1e2ec; --acc: oklch(51% 0.21 277); --acc-soft: oklch(95% 0.03 277); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #14151d; --panel: #1b1d28; --ink: #ecedf5; --muted: #a2a5ba; --line: #2c2f3e; --acc: oklch(75% 0.12 277); --acc-soft: oklch(27% 0.045 277); } }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 "Pretendard Variable", system-ui, sans-serif; display: grid; grid-template-columns: 22rem minmax(0, 1fr); }
aside { height: 100vh; overflow-y: auto; background: var(--panel); border-right: 1px solid var(--line); padding: 1rem 1rem 3rem; }
h1 { font-size: 1.05rem; margin: 0 0 .2rem; }
.sub { margin: 0 0 1rem; color: var(--muted); font-size: 12px; }
.grp { margin: 0 0 1rem; }
.grp h2 { font-size: 11px; letter-spacing: .06em; color: var(--muted); margin: 1.2rem 0 .5rem; text-transform: uppercase; }
.opt { margin: 0 0 .85rem; }
.opt > b { display: block; font-size: 13px; margin-bottom: .1rem; }
.opt > small { display: block; color: var(--muted); font-size: 11.5px; margin-bottom: .35rem; }
.seg { display: flex; flex-wrap: wrap; gap: .3rem; }
.seg button { border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 999px; padding: .32rem .7rem; font: inherit; font-size: 12.5px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--acc); border-color: var(--acc); color: #fff; }
.bar { display: flex; flex-wrap: wrap; gap: .3rem; }
.sum { margin-top: 1rem; padding: .7rem .8rem; border-radius: 10px; background: var(--acc-soft); font-size: 12px; white-space: pre-wrap; }
.reset { margin-top: .6rem; border: 0; background: none; color: var(--muted); text-decoration: underline; cursor: pointer; font: inherit; font-size: 12px; }
main { position: relative; overflow: hidden; height: 100vh; }
#box { position: absolute; left: 50%; top: 0; transform-origin: top center; }
iframe { border: 0; width: 100%; height: 100%; background: #fff; box-shadow: 0 0 0 1px var(--line); }
@media (max-width: 860px) { body { grid-template-columns: 1fr; grid-template-rows: auto 70vh; } aside { height: auto; max-height: 45vh; } main { height: 70vh; } }
</style>
</head>
<body>
<aside>
  <h1>연구 축 조율실</h1>
  <p class="sub">연구 축 칩을 누르면 가는 페이지의 시안입니다. 고른 값은 이 브라우저에 남습니다.</p>
  <div class="grp"><h2>보기</h2>
    <div class="opt"><b>페이지</b><div class="seg" data-view="page"></div></div>
    <div class="opt"><b>화면 폭</b><div class="seg" data-view="vp"></div></div>
  </div>
  <div id="opts"></div>
  <div class="sum" id="sum"></div>
  <button class="reset" type="button" id="reset">기본값으로</button>
</aside>
<main><div id="box"><iframe id="view" title="연구 축 페이지 미리보기"></iframe></div></main>
<script>
(function () {
  "use strict";
  var KEY = "probe.pg.pillar.v1", VKEY = "probe.pg.pillar.view.v1";
  var SECTIONS = [
    ["머리", [
      ["head", "머리 모양", "제목 부분의 바탕", [["tint", "축 색 띠"], ["band", "다른 목록과 같은 띠"], ["plain", "띠 없음"]]],
      ["desc", "축 설명 한 줄", "한국어는 MASTER 문장을 옮긴 초안 — 실제 문장은 따로 정합니다", [["ko", "한국어 (초안)"], ["en", "MASTER 영어 원문"], ["none", "없음"]]],
      ["stats", "숫자 줄", "분석 · 비교 · 탐색 · 결정 개수", [["show", "보이기"], ["hide", "숨기기"]]],
      ["crumb", "경로 줄", "'연구 축 › P2' — 다섯 축 모음 페이지로 가는 길", [["show", "보이기"], ["hide", "숨기기"]]]
    ]],
    ["다른 축으로", [
      ["nav", "다른 축으로 가는 길", "", [["axes", "연구 축 줄 (분석 목록과 같은 줄)"], ["chips", "칩 줄"], ["none", "없음"]]]
    ]],
    ["본문", [
      ["layout", "짜임", "탭은 탐색 · 분석 · 비교, 결정은 탭 아래", [["tabs", "탭 — 한 번에 하나"], ["stack", "차례로 쌓기"], ["two", "두 단"]]],
      ["alist", "분석 모양", "", [["table", "분석 목록과 같은 표"], ["cards", "카드"]]],
      ["acount", "분석 개수", "", [["5", "5편 + 모두 보기"], ["all", "전부"]]]
    ]],
    ["결정", [
      ["dec", "결정 한 줄", "결정 기록(D#)은 제목을 앞세웁니다", [["choice", "제목 + 현재 선택"], ["title", "제목만"]]],
      ["dcode", "결정 기호(D9NB 등)", "", [["show", "작게 곁들임"], ["hide", "숨김"]]],
      ["decpos", "결정 위치", "'차례로 쌓기'일 때만 — 탭일 때는 늘 탭 아래", [["last", "맨 아래"], ["first", "맨 위"]]]
    ]]
  ];
  var DEF = { head: "tint", desc: "ko", stats: "hide", crumb: "hide", nav: "none", layout: "tabs",
              alist: "table", acount: "5", dec: "choice", dcode: "show", decpos: "last" };
  var PAGES = [["P0", "P0"], ["P1", "P1"], ["P2", "P2"], ["P3", "P3"], ["P4", "P4"], ["all", "다섯 축 모음"]];
  var VPS = [["desk", "데스크톱", 1280], ["mobile", "휴대폰", 390]];
  function load(k, d) { try { return JSON.parse(localStorage.getItem(k) || "null") || d; } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  var state = Object.assign({}, DEF, load(KEY, {}));
  // a saved value the current choices no longer offer falls back to the default
  SECTIONS.forEach(function (g) { g[1].forEach(function (o) { if (!o[3].some(function (c) { return c[0] === state[o[0]]; })) state[o[0]] = DEF[o[0]]; }); });
  var view = Object.assign({ page: "P2", vp: "desk" }, load(VKEY, {}));
  var frame = document.getElementById("view"), box = document.getElementById("box"), main = document.querySelector("main");

  function seg(el, items, cur, pick) {
    el.innerHTML = "";
    items.forEach(function (it) {
      var b = document.createElement("button"); b.type = "button"; b.textContent = it[1];
      b.setAttribute("aria-pressed", String(it[0] === cur));
      b.addEventListener("click", function () { pick(it[0]); });
      el.appendChild(b);
    });
  }
  function drawOpts() {
    var root = document.getElementById("opts"); root.innerHTML = "";
    SECTIONS.forEach(function (g) {
      var grp = document.createElement("div"); grp.className = "grp"; grp.innerHTML = "<h2>" + g[0] + "</h2>";
      g[1].forEach(function (o) {
        var d = document.createElement("div"); d.className = "opt";
        d.innerHTML = "<b>" + o[1] + "</b>" + (o[2] ? "<small>" + o[2] + "</small>" : "") + '<div class="seg"></div>';
        seg(d.querySelector(".seg"), o[3], state[o[0]], function (v) { state[o[0]] = v; save(KEY, state); drawOpts(); apply(); });
        grp.appendChild(d);
      });
      root.appendChild(grp);
    });
    var lines = [];
    SECTIONS.forEach(function (g) { g[1].forEach(function (o) { var c = o[3].filter(function (x) { return x[0] === state[o[0]]; })[0]; lines.push(o[1] + ": " + c[1]); }); });
    document.getElementById("sum").textContent = "내 설정\n" + lines.join("\n");
  }
  function drawView() {
    seg(document.querySelector('[data-view="page"]'), PAGES, view.page, function (v) { view.page = v; save(VKEY, view); drawView(); load_(); });
    seg(document.querySelector('[data-view="vp"]'), VPS, view.vp, function (v) { view.vp = v; save(VKEY, view); drawView(); fit(); });
  }
  function apply() {
    save(KEY, state);
    try { if (frame.contentWindow && frame.contentWindow.plApply) frame.contentWindow.plApply(); } catch (e) {}
  }
  function load_() { frame.src = view.page === "all" ? "site/pl/index.html" : "site/pl/" + view.page + "/index.html"; }
  function fit() {
    var W = VPS.filter(function (v) { return v[0] === view.vp; })[0][2];
    var aw = main.clientWidth - 24, ah = main.clientHeight, k = Math.min(1, aw / W);
    box.style.width = W + "px"; box.style.height = (ah / k) + "px";
    box.style.transform = "translateX(-50%) scale(" + k + ")";
  }
  frame.addEventListener("load", apply);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(main); else addEventListener("resize", fit);
  document.getElementById("reset").addEventListener("click", function () { state = Object.assign({}, DEF); save(KEY, state); drawOpts(); apply(); });
  save(KEY, state); drawOpts(); drawView(); load_(); fit();
})();
</script>
</body>
</html>
