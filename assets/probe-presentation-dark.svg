<svg xmlns="http://www.w3.org/2000/svg" width="72" height="96" viewBox="12 0 72 96" role="img" aria-label="PROBE — presenting a paper to a room">
  <style>
    .hull   { fill: #E8916F; }
    .iris   { fill: #FFF6F1; }
    .pupil  { fill: #2A1A12; }
    .stalk  { stroke: #F0A183; stroke-width: 5; stroke-linecap: round; fill: none; }
    .beacon { fill: #F0A183; }
    .page   { fill: #FFF6F1; stroke: #C98A6D; stroke-width: 2; }
    .line   { fill: #C98A6D; opacity: .45; }
    .who    { fill: #C98A6D; }
    .shadow { fill: #F0A183; opacity: .5; }

    /* The character bobs; the screen behind does not, because a screen that
       moved with the presenter would read as held rather than stood in front
       of. The listener breathes on `human.svg`'s own cycle — it is that
       glyph. */
    .rig    { animation: bob 4.2s ease-in-out infinite; }
    .who    { animation: breathe 4.6s ease-in-out infinite; }
    /* The talk advances one band at a time, and the pupils go with it: out to
       the listener on the left while nothing is lit, back to the screen as
       each band comes up. That pair is the whole icon — the others read down
       at a page, this one looks up and across. */
    .b1     { animation: beat 5.4s ease-in-out .3s infinite; }
    .b2     { animation: beat 5.4s ease-in-out 2.4s infinite; }
    .pupil  { animation: look 5.4s ease-in-out infinite; }
    @keyframes bob     { 0%, 100% { transform: translateY(0); }
                          50% { transform: translateY(-2px); } }
    @keyframes breathe { 0%, 100% { transform: translateY(0); }
                          50% { transform: translateY(-1.2px); } }
    @keyframes beat    { 0%, 4% { opacity: .45; } 12%, 34% { opacity: .95; }
                          44%, 100% { opacity: .45; } }
    @keyframes look    { 0%, 16% { transform: translate(-3.2px, 0); }
                          30%, 66% { transform: translate(3px, -2px); }
                          80%, 100% { transform: translate(-3.2px, 0); } }
    @media (prefers-reduced-motion: reduce) {
      .rig, .who, .pupil, .line { animation: none; }
      .line { opacity: .6; }
    }
  </style>

  <ellipse class="shadow" cx="55" cy="88" rx="15" ry="4"/>
  <g class="screen">
    <rect class="page" x="40" y="9" width="44" height="40" rx="3.5"/>
    <rect class="line b1" x="46" y="16" width="32" height="3.2" rx="1.6"/>
    <rect class="line b2" x="46" y="23" width="24" height="3.2" rx="1.6"/>
  </g>
  <g class="rig">
    <path class="stalk" d="M48 26 V19"/>
    <circle class="beacon" cx="48" cy="16" r="5"/>
    <rect class="hull" x="17" y="27" width="62" height="54" rx="19"/>
    <g class="eye eL"><g class="lid"><circle class="iris" cx="36" cy="52" r="11"/><circle class="pupil" cx="36" cy="51" r="5"/></g></g>
    <g class="eye eR"><g class="lid"><circle class="iris" cx="60" cy="52" r="11"/><circle class="pupil" cx="60" cy="51" r="5"/></g></g>
  </g>
  <g class="who">
    <circle cx="27" cy="78" r="7.8"/>
    <path d="M12.4 101 a14.6 14.6 0 0 1 29.2 0 Z"/>
  </g>
</svg>
