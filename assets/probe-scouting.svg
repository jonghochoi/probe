<svg xmlns="http://www.w3.org/2000/svg" width="72" height="96" viewBox="12 0 72 96" role="img" aria-label="PROBE — taking a reading">
  <style>
    .hull   { fill: #D97757; }
    .iris   { fill: #FFFAF7; }
    .pupil  { fill: #2A1A12; transform-box: fill-box; transform-origin: center; }
    .stem   { stroke: #CC785C; stroke-width: 3.6; stroke-linecap: round; fill: none; }
    .leaf   { fill: #CC785C; }
    .sprout { transform-box: view-box; transform-origin: 48px 27px;
              animation: sway 3.2s ease-in-out infinite; }
    @keyframes sway { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
    .shadow { fill: #CC785C; opacity: .55; }
    .wave   { fill: none; stroke: #2EA865; stroke-width: 2.2;
              stroke-linecap: round; opacity: 0; }
    .rim    { fill: #9141AC; }
    .ring   { fill: none; stroke: #9141AC; stroke-width: 2.6; stroke-linecap: round; }
    .mast   { fill: none; stroke: #9141AC; stroke-width: 2.6; stroke-linecap: round; }
    .glass  { fill: #4FD08A; fill-opacity: .42; }
    .shine  { fill: #FFFFFF; opacity: .55; }
    .dot    { fill: #2EA865; }
    .seg    { fill: #9141AC; opacity: .1; }
    .rig     { animation: bob 3.4s ease-in-out infinite; }
    .scouter { animation: shake 4.4s linear infinite; }
    .pupil   { animation: shock 4.4s ease-out infinite; }
    .glass   { animation: alarm 4.4s linear infinite; }
    .dot     { animation: sig0 4.4s linear infinite; }
    .w1      { animation: sig1 4.4s linear infinite; }
    .w2      { animation: sig2 4.4s linear infinite; }
    .s0 { animation: s0 4.4s steps(1, end) infinite; }
    .s1 { animation: s1 4.4s steps(1, end) infinite; }
    .s2 { animation: s2 4.4s steps(1, end) infinite; }
    .s3 { animation: s3 4.4s steps(1, end) infinite; }
    .s4 { animation: s4 4.4s steps(1, end) infinite; }
    @keyframes bob   { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes s0    { 0%, 6%  { opacity: .1; } 7%, 82%  { opacity: .6; } 83%, 100% { opacity: .1; } }
    @keyframes s1    { 0%, 16% { opacity: .1; } 17%, 82% { opacity: .6; } 83%, 100% { opacity: .1; } }
    @keyframes s2    { 0%, 26% { opacity: .1; } 27%, 82% { opacity: .6; } 83%, 100% { opacity: .1; } }
    @keyframes s3    { 0%, 36% { opacity: .1; } 37%, 82% { opacity: .6; } 83%, 100% { opacity: .1; } }
    @keyframes s4    { 0%, 46% { opacity: .1; } 47%, 82% { opacity: .6; } 83%, 100% { opacity: .1; } }
    @keyframes sig0  { 0%, 3% { opacity: 0; } 5%, 22% { opacity: 1; } 25%, 29% { opacity: 0; }
                       31%, 48% { opacity: 1; } 51%, 56% { opacity: 0; } 58%, 64% { opacity: 1; }
                       66%, 68% { opacity: 0; } 70%, 76% { opacity: 1; } 80%, 100% { opacity: 0; } }
    @keyframes sig1  { 0%, 8% { opacity: 0; } 10%, 22% { opacity: .9; } 25%, 34% { opacity: 0; }
                       36%, 48% { opacity: .9; } 51%, 56% { opacity: 0; } 58%, 64% { opacity: .9; }
                       66%, 68% { opacity: 0; } 70%, 76% { opacity: .9; } 80%, 100% { opacity: 0; } }
    @keyframes sig2  { 0%, 13% { opacity: 0; } 15%, 22% { opacity: .9; } 25%, 39% { opacity: 0; }
                       41%, 48% { opacity: .9; } 51%, 56% { opacity: 0; } 58%, 64% { opacity: .9; }
                       66%, 68% { opacity: 0; } 70%, 76% { opacity: .9; } 80%, 100% { opacity: 0; } }
    @keyframes alarm { 0%, 56% { fill-opacity: .42; } 58% { fill-opacity: .8; } 62% { fill-opacity: .42; }
                       66% { fill-opacity: .8; } 70% { fill-opacity: .42; } 74% { fill-opacity: .8; }
                       80%, 100% { fill-opacity: .42; } }
    @keyframes shake { 0%, 58% { transform: translate(0, 0); } 60% { transform: translate(-.9px, .4px); }
                       62% { transform: translate(.9px, -.4px); } 64% { transform: translate(-.7px, -.3px); }
                       66% { transform: translate(.7px, .3px); } 68% { transform: translate(-.5px, 0); }
                       70% { transform: translate(.5px, 0); } 72%, 100% { transform: translate(0, 0); } }
    @keyframes shock { 0%, 56% { transform: scale(1); } 60%, 80% { transform: scale(.6); } 90%, 100% { transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) {
      .rig, .sprout, .scouter, .pupil, .glass, .dot, .wave, .seg { animation: none; }
      .wave { opacity: .5; }
      .s0, .s1, .s2 { opacity: .6; }
    }
  </style>

  <ellipse class="shadow" cx="48" cy="90" rx="20" ry="4"/>
  <g class="rig">
    <g class="sprout"><path class="stem" d="M48 26.5 V18.5"/><path class="leaf" d="M48 20.5 C43 20.6, 39.4 17.6, 38.5 13.5 C43.2 13, 47.2 15.6, 48 20.5 Z"/><path class="leaf" d="M48 18.2 C53.2 17.6, 57.6 14, 58.5 9.5 C53.2 9.5, 48.8 13, 48 18.2 Z"/></g>
    <rect class="hull" x="17" y="27" width="62" height="54" rx="19"/>
    <g class="eye eL"><g class="lid"><circle class="iris" cx="36" cy="52" r="11"/><circle class="pupil" cx="36" cy="52" r="5"/></g></g>
    <g class="eye eR"><g class="lid"><circle class="iris" cx="60" cy="52" r="11"/><circle class="pupil" cx="60" cy="52" r="5"/></g></g>
    <g class="scouter">
      <path class="mast" d="M77.25 44 V29.6"/>
      <circle class="dot" cx="77.25" cy="23.5" r="2.2"/>
      <path class="wave w1" d="M74.01 18.69 A5.8 5.8 0 0 1 80.49 18.69"/>
      <path class="wave w2" d="M71.66 15.21 A10 10 0 0 1 82.84 15.21"/>
      <rect class="rim" x="73.5" y="41" width="7.5" height="19" rx="3.75"/>
      <rect class="rim" x="72" y="49.4" width="5" height="4.6" rx="1.5"/>
      <circle class="glass" cx="60" cy="52" r="12.6"/>
      <circle class="ring" cx="60" cy="52" r="13.4"/>
      <path class="shine" d="M51.2 47.2 a10 10 0 0 1 4.6 -4.6 l1 1.8 a8 8 0 0 0 -3.7 3.7 z"/>
      <circle class="seg s0" cx="64.93" cy="59.05" r="1.35"/>
      <circle class="seg s1" cx="67.05" cy="56.93" r="1.35"/>
      <circle class="seg s2" cx="68.31" cy="54.23" r="1.35"/>
      <circle class="seg s3" cx="68.57" cy="51.25" r="1.35"/>
      <circle class="seg s4" cx="67.79" cy="48.37" r="1.35"/>
    </g>
  </g>
</svg>
