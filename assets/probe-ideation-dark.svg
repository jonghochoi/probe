<svg xmlns="http://www.w3.org/2000/svg" width="72" height="96" viewBox="12 0 72 96" role="img" aria-label="PROBE — thinking up what nobody has tried">
  <style>
    .hull   { fill: #E8916F; }
    .iris   { fill: #FFF6F1; }
    .pupil  { fill: #2A1A12; }
    .stem   { stroke: #F0A183; stroke-width: 3.6; stroke-linecap: round; fill: none; }
    .leaf   { fill: #F0A183; }
    .page   { fill: #FFF6F1; stroke: #C98A6D; stroke-width: 2; }
    .line   { fill: #C98A6D; opacity: .3; }
    .shadow { fill: #F0A183; opacity: .45; }
    .dim    { fill: #6E625B; }
    .dimst  { stroke: #5E534C; stroke-width: 3.6; stroke-linecap: round; fill: none; }
    .dimbe  { fill: #5E534C; }
    .cross  { fill: none; stroke: #2A211C; stroke-width: 3.2; stroke-linecap: round; }
    .mug    { fill: #FFF6F1; stroke: #C98A6D; stroke-width: 2; stroke-linejoin: round; }
    .handle { fill: none; stroke: #C98A6D; stroke-width: 2.4; stroke-linecap: round; }
    .brew   { fill: #C98A6D; }
    .steam  { fill: none; stroke: #F0A183; stroke-width: 2.2; stroke-linecap: round; opacity: 0; }
    .rig    { animation: bob 3.4s ease-in-out infinite; }
    .sprout { transform-box: view-box; transform-origin: 48px 27px;
              animation: sway 3.2s ease-in-out infinite; }
    .lid    { transform-box: fill-box; transform-origin: 50% 50%;
              animation: blink 7s ease-in-out infinite; }
    .readp  { animation: read 3.6s ease-in-out infinite; }
    .l1     { animation: lit 4.8s ease-in-out infinite; }
    .l2     { animation: lit 4.8s ease-in-out 1.6s infinite; }
    .l3     { animation: lit 4.8s ease-in-out 3.2s infinite; }
    .s1     { animation: steam 3.8s ease-in-out infinite; }
    .s2     { animation: steam 3.8s ease-in-out 1.9s infinite; }
    .breathe { animation: breathe 4.6s ease-in-out infinite; }
    .drift  { transform-box: fill-box; transform-origin: 50% 100%;
              animation: drift 4.6s ease-in-out infinite; }
    @keyframes bob   { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes sway  { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
    @keyframes blink { 0%, 44%, 50%, 100% { transform: scaleY(1); } 47% { transform: scaleY(.08); } }
    @keyframes read  { 0% { transform: translateX(-2.4px); } 72% { transform: translateX(2.4px); }
                       86%, 100% { transform: translateX(-2.4px); } }
    @keyframes lit   { 0%, 28% { opacity: .95; } 34%, 100% { opacity: .3; } }
    @keyframes steam { 0% { opacity: 0; transform: translateY(2px); } 30%, 55% { opacity: .7; }
                       100% { opacity: 0; transform: translateY(-6px); } }
    @keyframes drift { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
    @keyframes breathe { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.6px); } }

    .bub  { fill: #FFF6F1; stroke: #C98A6D; stroke-width: 1.6; }
    .bdot { fill: #C98A6D; opacity: .2; }
    .t1   { animation: think 2.4s ease-in-out infinite; }
    .t2   { animation: think 2.4s ease-in-out .3s infinite; }
    .t3   { animation: think 2.4s ease-in-out .6s infinite; }
    @keyframes think { 0%, 100% { opacity: .2; } 40% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
<g transform="translate(0 0) scale(1)">
    <ellipse class="shadow" cx="48" cy="90" rx="20" ry="4"/><g class="rig">
      <g class="sprout"><path class="stem" d="M48 26.5 V18.5"/><path class="leaf" d="M48 20.5 C43 20.6, 39.4 17.6, 38.5 13.5 C43.2 13, 47.2 15.6, 48 20.5 Z"/><path class="leaf" d="M48 18.2 C53.2 17.6, 57.6 14, 58.5 9.5 C53.2 9.5, 48.8 13, 48 18.2 Z"/></g>
      <rect class="hull" x="17" y="27" width="62" height="54" rx="19"/>
      <g class="lid"><circle class="iris" cx="36" cy="52" r="11"/><circle class="pupil" cx="38.5" cy="48" r="5"/></g><g class="lid"><circle class="iris" cx="60" cy="52" r="11"/><circle class="pupil" cx="62.5" cy="48" r="5"/></g>
      
    </g>
  </g><g class="rig">
      <circle class="bub" cx="61.5" cy="28.5" r="1.8"/><circle class="bub" cx="66" cy="22" r="2.6"/>
      <ellipse class="bub" cx="71.5" cy="10.5" rx="11.5" ry="6.5"/>
      <circle class="bdot t1" cx="66" cy="10.5" r="2"/><circle class="bdot t2" cx="71.5" cy="10.5" r="2"/><circle class="bdot t3" cx="77" cy="10.5" r="2"/></g>
</svg>
