><circle class="d" cx="48" cy="288" r="3.4"/><circle class="d" cx="73" cy="288" r="3.4"/><circle class="d" cx="123" cy="288" r="3.4"/><circle class="d" cx="148" cy="288" r="3.4"/><circle class="d" cx="173" cy="288" r="3.4"/><circle class="d" cx="198" cy="288" r="3.4"/><circle class="d" cx="223" cy="288" r="3.4"/><g transform="translate(73 188)"><circle class="mk" id="m0" r="3.4"/></g><g transform="translate(98 288)"><circle class="mk" id="m1" r="3.4"/></g><g transform="translate(123 138)"><circle class="mk" id="m2" r="3.4"/></g><g transform="translate(148 213)"><circle class="mk" id="m3" r="3.4"/></g><g transform="translate(198 163)"><circle class="mk" id="m4" r="3.4"/></g><g transform="translate(223 238)"><circle class="mk" id="m5" r="3.4"/></g>
  <text class="note" x="44" y="312" font-size="10.5">50–100 papers a day</text>

