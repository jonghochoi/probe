<svg xmlns="http://www.w3.org/2000/svg" width="880" height="336" viewBox="0 0 880 336" role="img" aria-label="PROBE pipeline — arXiv in, scouting and analysis out">
  <style>
    .hull   { fill: #E8916F; }
    .iris   { fill: #FFF6F1; }
    .pupil  { fill: #2A1A12; }
    .stalk  { stroke: #F0A183; stroke-width: 5; stroke-linecap: round; fill: none; }
    .beacon { fill: #F0A183; }
    .wave   { fill: none; stroke: #F0A183; stroke-width: 2.6;
              stroke-linecap: round; opacity: 0; }
    .shadow { fill: #F0A183; opacity: .45; }
    .rig    { animation: bob 3.4s ease-in-out infinite; }
    .w1     { animation: ping 2.6s ease-in-out infinite; }
    .w2     { animation: ping 2.6s ease-in-out .34s infinite; }
    .lid    { animation: blink 5.4s ease-in-out infinite; }
    .eL, .eL .lid { transform-origin: 36px 52px; }
    .eR, .eR .lid { transform-origin: 60px 52px; }
    @keyframes bob   { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes ping  { 0%, 100% { opacity: 0; } 12%, 42% { opacity: .85; } 58% { opacity: 0; } }
    @keyframes blink { 0%, 88%, 100% { transform: scaleY(1); }
                       92% { transform: scaleY(.06); } 96% { transform: scaleY(1); } }
    @keyframes march { to { stroke-dashoffset: -14; } }

    .m    { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
    .lab  { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; font-size: 10px; letter-spacing: 2.2px; fill: #C98A6D; }
    .tick { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; font-size: 9.5px; letter-spacing: 1.4px; fill: #C98A6D; }
    .path { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; font-size: 13.5px; font-weight: 700; fill: #F2EAE4; }
    .note { font-family: system-ui, -apple-system, 'Segoe UI', 'Noto Sans KR', sans-serif; font-size: 11px; fill: #A08D80; }
    .wire { fill: none; stroke: #E8916F; stroke-width: 1.6; stroke-linecap: round;
            stroke-linejoin: round; }
    .flow { stroke-dasharray: 7 7; animation: march 1.1s linear infinite; }
    .head { fill: #E8916F; }

    .d    { fill: #3D3129; opacity: .85; }
    .mk   { fill: #3D3129; opacity: .9; }
    .tv   { fill: #E8916F; opacity: 0; }
    .keep { fill: #E8916F; animation: keep 9s linear infinite; }
    .scan { animation: scan 9s linear infinite; }
    @keyframes scan {
      0%        { transform: translateX(0); opacity: 0; }
      3%        { opacity: .11; }
      30%       { transform: translateX(196px); opacity: .11; }
      34%, 100% { transform: translateX(196px); opacity: 0; }
    }
    @keyframes keep {
      0%, 34%   { opacity: 1; }
      40%, 100% { opacity: 0; }
    }
    #m0 { animation: mark0 9s linear infinite; }
    @keyframes mark0 {
      0%, 4.6%        { fill: #3D3129; transform: scale(1); }
      6.1%      { fill: #E8916F; transform: scale(1.9); }
      10.6%        { fill: #E8916F; transform: scale(1); }
      34%           { fill: #E8916F; transform: scale(1); }
      39%, 100% { fill: #3D3129; transform: scale(1); }
    }
    #t0 { animation: trav0 9s ease-in-out infinite; }
    @keyframes trav0 {
      0%, 34%        { transform: translate(0, 0) scale(1); opacity: 0; }
      35%        { transform: translate(0, 0) scale(1); opacity: 1; }
      58%           { transform: translate(331px, -2px) scale(1.6); opacity: 1; }
      62%, 100% { transform: translate(331px, -2px) scale(1.18); opacity: 1; }
    }
    #m1 { animation: mark1 9s linear infinite; }
    @keyframes mark1 {
      0%, 8.4%        { fill: #3D3129; transform: scale(1); }
      9.9%      { fill: #E8916F; transform: scale(1.9); }
      14.4%        { fill: #E8916F; transform: scale(1); }
      36%           { fill: #E8916F; transform: scale(1); }
      41%, 100% { fill: #3D3129; transform: scale(1); }
    }
    #t1 { animation: trav1 9s ease-out infinite; }
    @keyframes trav1 {
      0%, 36%    { transform: translate(0, 0) scale(1); opacity: 0; fill: #E8916F; }
      37%    { transform: translate(0, 0) scale(1); opacity: 1; fill: #E8916F; }
      49%       { transform: translate(168px, -45px) scale(1); opacity: 1; fill: #E8916F; }
      53%       { transform: translate(168px, -45px) scale(1); opacity: .9; fill: #A08D80; }
      65%, 100% { transform: translate(190px, -51px) scale(.72); opacity: 0; fill: #A08D80; }
    }
    #m2 { animation: mark2 9s linear infinite; }
    @keyframes mark2 {
      0%, 12.2%        { fill: #3D3129; transform: scale(1); }
      13.7%      { fill: #E8916F; transform: scale(1.9); }
      18.2%        { fill: #E8916F; transform: scale(1); }
      38%           { fill: #E8916F; transform: scale(1); }
      43%, 100% { fill: #3D3129; transform: scale(1); }
    }
    #t2 { animation: trav2 9s ease-out infinite; }
    @keyframes trav2 {
      0%, 38%    { transform: translate(0, 0) scale(1); opacity: 0; fill: #E8916F; }
      39%    { transform: translate(0, 0) scale(1); opacity: 1; fill: #E8916F; }
      51%       { transform: translate(118px, 29px) scale(1); opacity: 1; fill: #E8916F; }
      55%       { transform: translate(118px, 29px) scale(1); opacity: .9; fill: #A08D80; }
      67%, 100% { transform: translate(133px, 32px) scale(.72); opacity: 0; fill: #A08D80; }
    }
    #m3 { animation: mark3 9s linear infinite; }
    @keyframes mark3 {
      0%, 16.1%        { fill: #3D3129; transform: scale(1); }
      17.6%      { fill: #E8916F; transform: scale(1.9); }
      22.1%        { fill: #E8916F; transform: scale(1); }
      40%           { fill: #E8916F; transform: scale(1); }
      45%, 100% { fill: #3D3129; transform: scale(1); }
    }
    #t3 { animation: trav3 9s ease-in-out infinite; }
    @keyframes trav3 {
      0%, 40%        { transform: translate(0, 0) scale(1); opacity: 0; }
      41%        { transform: translate(0, 0) scale(1); opacity: 1; }
      62%           { transform: translate(256px, -7px) scale(1.6); opacity: 1; }
      66%, 100% { transform: translate(256px, -7px) scale(1.18); opacity: 1; }
    }
    #m4 { animation: mark4 9s linear infinite; }
    @keyframes mark4 {
      0%, 23.7%        { fill: #3D3129; transform: scale(1); }
      25.2%      { fill: #E8916F; transform: scale(1.9); }
      29.7%        { fill: #E8916F; transform: scale(1); }
      42%           { fill: #E8916F; transform: scale(1); }
      47%, 100% { fill: #3D3129; transform: scale(1); }
    }
    #t4 { animation: trav4 9s ease-out infinite; }
    @keyframes trav4 {
      0%, 42%    { transform: translate(0, 0) scale(1); opacity: 0; fill: #E8916F; }
      43%    { transform: translate(0, 0) scale(1); opacity: 1; fill: #E8916F; }
      55%       { transform: translate(82px, 17px) scale(1); opacity: 1; fill: #E8916F; }
      59%       { transform: translate(82px, 17px) scale(1); opacity: .9; fill: #A08D80; }
      71%, 100% { transform: translate(93px, 19px) scale(.72); opacity: 0; fill: #A08D80; }
    }
    #m5 { animation: mark5 9s linear infinite; }
    @keyframes mark5 {
      0%, 27.6%        { fill: #3D3129; transform: scale(1); }
      29.1%      { fill: #E8916F; transform: scale(1.9); }
      33.6%        { fill: #E8916F; transform: scale(1); }
      44%           { fill: #E8916F; transform: scale(1); }
      49%, 100% { fill: #3D3129; transform: scale(1); }
    }
    #t5 { animation: trav5 9s ease-in-out infinite; }
    @keyframes trav5 {
      0%, 44%        { transform: translate(0, 0) scale(1); opacity: 0; }
      45%        { transform: translate(0, 0) scale(1); opacity: 1; }
      66%           { transform: translate(181px, -12px) scale(1.6); opacity: 1; }
      70%, 100% { transform: translate(181px, -12px) scale(1.18); opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .rig, .lid, .wave, .flow { animation: none; }
      .wave { opacity: .5; }
      .scan, .tv { display: none; }
      .mk, .keep { animation: none; }
      .mk { fill: #E8916F; }
      .keep { opacity: 1; }
    }
  </style>

  <rect width="880" height="336" rx="14" fill="#211C19"/>
  <rect x=".75" y=".75" width="878.5" height="334.5" rx="13.25" fill="none" stroke="#3D3129"/>

