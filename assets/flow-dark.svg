<svg xmlns="http://www.w3.org/2000/svg" width="880" height="336" viewBox="0 0 880 336" role="img" aria-label="PROBE funnel — arXiv in, 3–5 decision-grade papers out">
  <style>
    .hull   { fill: #E8916F; }
    .iris   { fill: #FFF6F1; }
    .pupil  { fill: #2A1A12; }
    .stalk  { stroke: #F0A183; stroke-width: 5; stroke-linecap: round; fill: none; }
    .beacon { fill: #F0A183; }
    .wave   { fill: none; stroke: #F0A183; stroke-width: 2.6;
              stroke-linecap: round; opacity: 0; }
    .shadow { fill: #F0A183; opacity: .45; }
    .rig  { animation: bob 3.4s ease-in-out infinite; }
    .w1   { animation: ping 2.6s ease-in-out infinite; }
    .w2   { animation: ping 2.6s ease-in-out .34s infinite; }
    .lid  { animation: blink 5.4s ease-in-out infinite; }
    .eL, .eL .lid { transform-origin: 36px 52px; }
    .eR, .eR .lid { transform-origin: 60px 52px; }
    @keyframes bob   { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes ping  { 0%, 100% { opacity: 0; } 12%, 42% { opacity: .85; } 58% { opacity: 0; } }
    @keyframes blink { 0%, 88%, 100% { transform: scaleY(1); }
                       92% { transform: scaleY(.06); } 96% { transform: scaleY(1); } }
    @keyframes march { to { stroke-dashoffset: -14; } }

    .m    { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
    .s    { font-family: system-ui, -apple-system, 'Segoe UI', 'Noto Sans KR', sans-serif; }
    .lab  { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; font-size: 10px; letter-spacing: 2.2px; fill: #C98A6D; }
    .path { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; font-size: 13.5px; font-weight: 700; fill: #F2EAE4; }
    .note { font-family: system-ui, -apple-system, 'Segoe UI', 'Noto Sans KR', sans-serif; font-size: 11px; fill: #A08D80; }
    .tick { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; font-size: 9.5px; letter-spacing: 1.4px; fill: #C98A6D; }
    .wire { fill: none; stroke: #E8916F; stroke-width: 1.6; stroke-linecap: round;
            stroke-linejoin: round; }
    .flow { stroke-dasharray: 7 7; animation: march 1.1s linear infinite; }
    .loop { fill: none; stroke: #3D3129; stroke-width: 1.4; stroke-linecap: round;
            stroke-linejoin: round; stroke-dasharray: 3 5; }
    .head { fill: #E8916F; }

    .pin  { fill: #7EB6D4; }
    .pinh { fill: none; stroke: #211C19; stroke-width: 2.4; }
    .pinn { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; font-size: 10px; font-weight: 700; fill: #12232C;
            text-anchor: middle; }
    .lead { fill: none; stroke: #7EB6D4; stroke-width: 1.2; opacity: .75; }

    @media (prefers-reduced-motion: reduce) {
      .rig, .lid, .wave, .flow, .pulse { animation: none; }
      .wave { opacity: .5; }
    }
  </style>
