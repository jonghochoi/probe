<svg xmlns="http://www.w3.org/2000/svg" width="72" height="96" viewBox="12 0 72 96" role="img" aria-label="PROBE — getting a light-bulb idea">
  <style>
    .hull   { fill: #D97757; }
    .iris   { fill: #FFFAF7; }
    .pupil  { fill: #2A1A12; }
    .stem   { stroke: #CC785C; stroke-width: 3.6; stroke-linecap: round; fill: none; }
    .leaf   { fill: #CC785C; }
    .sprout { transform-origin: 48px 27px; animation: sway 3.2s ease-in-out infinite; }
    .shadow { fill: #CC785C; opacity: .55; }
    @keyframes sway { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
    @keyframes bob  { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

    .glass  { fill: #FFFAF7; stroke: #B06749; stroke-width: 1.6; animation: glow 5s linear infinite; }
    .screw  { fill: #9A8C84; }
    .ray    { stroke: #F5B700; stroke-width: 2.2; stroke-linecap: round; opacity: 0; animation: rays 5s linear infinite; }
    .fil    { fill: none; stroke: #B06749; stroke-width: 1.2; stroke-linecap: round; }
    .rig    { animation: bob 3.4s ease-in-out infinite; }
    .bulb   { animation: bob 3.4s ease-in-out infinite; }
    .lid    { transform: scaleY(0); transform-origin: 48px 40px; animation: squint 5s ease-in-out infinite; }
    .eyelid { fill: #D97757; }
    .pupil  { transform-box: fill-box; transform-origin: center; animation: dil 5s linear infinite; }
    @keyframes glow   { 0%, 30% { fill: #FFFAF7; } 31% { fill: #F5B700; } 33% { fill: #FFFAF7; }
                        37% { fill: #F5B700; }
                        38% { fill: #FFFAF7; } 41% { fill: #FFFAF7; } 42%, 86% { fill: #F5B700; } 87%, 100% { fill: #FFFAF7; } }
    @keyframes rays   { 0%, 41% { opacity: 0; } 42% { opacity: 1; } 60% { opacity: .5; } 66% { opacity: 1; }
                        86% { opacity: 1; } 87%, 100% { opacity: 0; } }
    @keyframes squint { 0%, 54% { transform: scaleY(0); } 60%, 84% { transform: scaleY(1); }
                        88%, 100% { transform: scaleY(0); } }
    @keyframes dil    { 0%, 41% { transform: scale(1); } 44%, 56% { transform: scale(1.25); }
                        60%, 100% { transform: scale(1); } }
  </style>
  <ellipse class="shadow" cx="48" cy="90" rx="20" ry="4"/>
  <g class="rig">
    <g class="sprout"><path class="stem" d="M48 26.5 V18.5"/><path class="leaf" d="M48 20.5 C43 20.6, 39.4 17.6, 38.5 13.5 C43.2 13, 47.2 15.6, 48 20.5 Z"/><path class="leaf" d="M48 18.2 C53.2 17.6, 57.6 14, 58.5 9.5 C53.2 9.5, 48.8 13, 48 18.2 Z"/></g>
    <rect class="hull" x="17" y="27" width="62" height="54" rx="19"/>
    <g><circle class="iris" cx="36" cy="52" r="11"/><circle class="pupil" cx="38.5" cy="48" r="5"/></g>
    <g><circle class="iris" cx="60" cy="52" r="11"/><circle class="pupil" cx="62.5" cy="48" r="5"/></g>
    <g class="lid"><rect class="eyelid" x="23" y="40" width="50" height="9"/></g>
  </g>
  <g class="bulb">
    <path class="ray" d="M61.1 9.8 L57.8 8.6"/><path class="ray" d="M64.6 5.2 L62.5 2.4"/><path class="ray" d="M70.0 3.5 L70.0 0.0"/><path class="ray" d="M75.4 5.2 L77.5 2.4"/><path class="ray" d="M78.9 9.8 L82.2 8.6"/><path class="ray" d="M79.2 15.5 L82.6 16.4"/><path class="ray" d="M60.8 15.5 L57.4 16.4"/>
    <path class="glass" d="M70 4 C75 4, 78.5 7.6, 78.5 12.4 C78.5 16, 76 17.6, 74.6 20 L65.4 20 C64 17.6, 61.5 16, 61.5 12.4 C61.5 7.6, 65 4, 70 4 Z"/>
    <path class="fil" d="M67.4 19 L67.4 14.6 L69 12.4 L71 14.6 L72.6 12.4 L72.6 19"/>
    <rect class="screw" x="65.6" y="20.6" width="8.8" height="2.6" rx="1"/>
    <rect class="screw" x="66.4" y="23.8" width="7.2" height="2.4" rx="1"/>
  </g>
</svg>
