<svg xmlns="http://www.w3.org/2000/svg" width="72" height="96" viewBox="12 0 72 96" role="img" aria-label="PROBE — reading one paper">
  <style>
    .hull   { fill: #D97757; }
    .iris   { fill: #FFFAF7; }
    .pupil  { fill: #2A1A12; }
    .stalk  { stroke: #CC785C; stroke-width: 5; stroke-linecap: round; fill: none; }
    .beacon { fill: #CC785C; }
    .page   { fill: #FFFAF7; stroke: #B06749; stroke-width: 2; }
    .line   { fill: #B06749; opacity: .3; }
    .shadow { fill: #CC785C; opacity: .55; }
    .rig   { animation: bob 4.2s ease-in-out infinite; }
    .pupil { animation: read 1.6s ease-in-out infinite; }
    .l1    { animation: lit 4.8s ease-in-out infinite; }
    .l2    { animation: lit 4.8s ease-in-out 1.6s infinite; }
    .l3    { animation: lit 4.8s ease-in-out 3.2s infinite; }
    @keyframes bob  { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
    @keyframes read { 0% { transform: translateX(-2.4px); }
                      72% { transform: translateX(2.4px); }
                      86%, 100% { transform: translateX(-2.4px); } }
    @keyframes lit  { 0%, 28% { opacity: .95; } 34%, 100% { opacity: .3; } }
    @media (prefers-reduced-motion: reduce) {
      .rig, .pupil, .line { animation: none; }
      .line { opacity: .55; }
    }
  </style>

  <ellipse class="shadow" cx="48" cy="90" rx="20" ry="4"/>
  <g class="rig">
    <path class="stalk" d="M48 26 V19"/>
    <circle class="beacon" cx="48" cy="16" r="5"/>
    <rect class="hull" x="17" y="27" width="62" height="54" rx="19"/>
    <g class="eye eL"><g class="lid"><circle class="iris" cx="36" cy="52" r="11"/><circle class="pupil" cx="36" cy="56.5" r="5"/></g></g>
    <g class="eye eR"><g class="lid"><circle class="iris" cx="60" cy="52" r="11"/><circle class="pupil" cx="60" cy="56.5" r="5"/></g></g>
    <g transform="rotate(-4 48 74.5)">
      <rect class="page" x="27" y="66" width="42" height="17" rx="3"/>
      <rect class="line l1" x="33" y="69.6" width="30" height="2.2" rx="1.1"/>
      <rect class="line l2" x="33" y="73.4" width="30" height="2.2" rx="1.1"/>
      <rect class="line l3" x="33" y="77.2" width="19" height="2.2" rx="1.1"/>
    </g>
  </g>
</svg>
