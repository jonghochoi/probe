<svg xmlns="http://www.w3.org/2000/svg" width="72" height="96" viewBox="12 0 72 96" role="img" aria-label="PROBE — sweeping the field">
  <style>
    .hull   { fill: #E8916F; }
    .iris   { fill: #FFF6F1; }
    .pupil  { fill: #2A1A12; }
    .stalk  { stroke: #F0A183; stroke-width: 5; stroke-linecap: round; fill: none; }
    .beacon { fill: #F0A183; }
    .wave   { fill: none; stroke: #F0A183; stroke-width: 2.6;
              stroke-linecap: round; opacity: 0; }
    .scan   { fill: #FFF6F1; opacity: .18; }
    .shadow { fill: #F0A183; opacity: .55; }
    .rig   { animation: bob 3.4s ease-in-out infinite; }
    .w1    { animation: ping 2.6s ease-in-out infinite; }
    .w2    { animation: ping 2.6s ease-in-out .34s infinite; }
    .pupil { animation: sweep 3.2s ease-in-out infinite; }
    .scan  { animation: band 3.2s ease-in-out infinite; }
    @keyframes bob   { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes ping  { 0%, 100% { opacity: 0; } 12%, 42% { opacity: .85; } 58% { opacity: 0; } }
    @keyframes sweep { 0%, 100% { transform: translateX(-3px); } 50% { transform: translateX(3px); } }
    @keyframes band  { 0%, 100% { transform: translateX(-27px); } 50% { transform: translateX(27px); } }
    @media (prefers-reduced-motion: reduce) {
      .rig, .wave, .pupil, .scan { animation: none; }
      .wave { opacity: .5; }
      .scan { opacity: 0; }
    }
  </style>

  <clipPath id="hull-clip"><rect x="17" y="27" width="62" height="54" rx="19"/></clipPath>

  <ellipse class="shadow" cx="48" cy="90" rx="20" ry="4"/>
  <g class="rig">
    <path class="wave w1" d="M41.04 11.12 A8.5 8.5 0 0 1 54.96 11.12"/>
    <path class="wave w2" d="M36.94 8.25 A13.5 13.5 0 0 1 59.06 8.25"/>
    <path class="stalk" d="M48 26 V19"/>
    <circle class="beacon" cx="48" cy="16" r="5"/>
    <rect class="hull" x="17" y="27" width="62" height="54" rx="19"/>
    <g class="eye eL"><g class="lid"><circle class="iris" cx="36" cy="52" r="11"/><circle class="pupil" cx="36" cy="52" r="5"/></g></g>
    <g class="eye eR"><g class="lid"><circle class="iris" cx="60" cy="52" r="11"/><circle class="pupil" cx="60" cy="52" r="5"/></g></g>
    <g clip-path="url(#hull-clip)"><rect class="scan" x="44" y="27" width="8" height="54" rx="4"/></g>
  </g>
</svg>
