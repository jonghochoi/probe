<svg xmlns="http://www.w3.org/2000/svg" width="72" height="96" viewBox="12 0 72 96" role="img" aria-label="PROBE — weighing two papers against each other">
  <style>
    .hull   { fill: #E8916F; }
    .iris   { fill: #FFF6F1; }
    .pupil  { fill: #2A1A12; }
    .stalk  { stroke: #F0A183; stroke-width: 5; stroke-linecap: round; fill: none; }
    .beacon { fill: #F0A183; }
    .page   { fill: #FFF6F1; stroke: #C98A6D; stroke-width: 2; }
    .line   { fill: #C98A6D; opacity: .3; }
    .shadow { fill: #F0A183; opacity: .55; }
    .rig   { animation: bob 4.2s ease-in-out infinite; }
    .pupil { animation: lean 4.4s ease-in-out infinite; }
    .pL    { transform-origin: 35px 74.5px; animation: panL 4.4s ease-in-out infinite; }
    .pR    { transform-origin: 61px 74.5px; animation: panR 4.4s ease-in-out infinite; }
    .gL    { animation: glow 4.4s ease-in-out infinite; }
    .gR    { animation: glow 4.4s ease-in-out 2.2s infinite; }
    @keyframes bob  { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
    @keyframes panL { 0%, 38% { transform: translateY(-3.4px) rotate(-4deg); }
                     50%, 88% { transform: translateY(3.4px) rotate(4deg); }
                     100% { transform: translateY(-3.4px) rotate(-4deg); } }
    @keyframes panR { 0%, 38% { transform: translateY(3.4px) rotate(4deg); }
                     50%, 88% { transform: translateY(-3.4px) rotate(-4deg); }
                     100% { transform: translateY(3.4px) rotate(4deg); } }
    @keyframes lean { 0%, 38% { transform: translateX(-3.6px); }
                     50%, 88% { transform: translateX(3.6px); }
                     100% { transform: translateX(-3.6px); } }
    @keyframes glow { 0%, 34% { opacity: .95; } 44%, 100% { opacity: .3; } }
    @media (prefers-reduced-motion: reduce) {
      .rig, .pupil, .pL, .pR, .line { animation: none; }
      .line { opacity: .55; }
    }
  </style>

  <ellipse class="shadow" cx="48" cy="90" rx="20" ry="4"/>
  <g class="rig">
    <path class="stalk" d="M48 26 V19"/>
    <circle class="beacon" cx="48" cy="16" r="5"/>
    <rect class="hull" x="17" y="27" width="62" height="54" rx="19"/>
    <g class="eye eL"><g class="lid"><circle class="iris" cx="36" cy="52" r="11"/><circle class="pupil" cx="36" cy="56.5" r="5"/></g></g>
    <g class="eye eR"><g class="lid"><circle class="iris" cx="60" cy="52" r="11"/><circle class="pupil" cx="60" cy="56.5" r="5"/></g></g>
    <g class="pL">
      <rect class="page" x="26" y="66" width="18" height="17" rx="3"/>
      <rect class="line gL" x="30" y="70.4" width="10" height="2.6" rx="1.3"/>
      <rect class="line gL" x="30" y="76.2" width="7" height="2.6" rx="1.3"/>
    </g>
    <g class="pR">
      <rect class="page" x="52" y="66" width="18" height="17" rx="3"/>
      <rect class="line gR" x="56" y="70.4" width="10" height="2.6" rx="1.3"/>
      <rect class="line gR" x="56" y="76.2" width="7" height="2.6" rx="1.3"/>
    </g>
  </g>
</svg>
