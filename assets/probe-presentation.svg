<svg xmlns="http://www.w3.org/2000/svg" width="72" height="96" viewBox="12 0 72 96" role="img" aria-label="PROBE — presenting until the screen crashes to :(">
  <style>
    .hull   { fill: #D97757; }
    .iris   { fill: #FFFAF7; }
    .pupil  { fill: #2A1A12; }
    .stem   { stroke: #CC785C; stroke-width: 3.6; stroke-linecap: round; fill: none; }
    .leaf   { fill: #CC785C; }
    .sprout { transform-origin: 48px 27px; animation: sway 3.2s ease-in-out infinite; }
    .page   { fill: #FFFAF7; stroke: #B06749; stroke-width: 2; }
    .line   { fill: #B06749; opacity: .3; }
    .shadow { fill: #CC785C; opacity: .55; }
    .sweat  { fill: #3E9BE0; opacity: 0; }
    @keyframes sway { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

    .line   { opacity: .45; }
    .who    { fill: #B06749; animation: breathe 4.6s ease-in-out infinite; }
    .bsod   { fill: #1F6FD1; opacity: 0; animation: bsod 6s steps(1, end) infinite; }
    .sad    { fill: #FFFFFF; font: 700 12px system-ui, sans-serif; opacity: 0; animation: bsod 6s steps(1, end) infinite; }
    .bands  { animation: glitch 6s linear infinite; }
    .rig    { animation: freeze 6s linear infinite; }
    .pupil  { transform-box: fill-box; transform-origin: center; animation: look 6s ease-in-out infinite; }
    .sweat  { animation: sweat 6s ease-in infinite; }
    .head   { transform-origin: 27px 86px; animation: tilt 6s ease-in-out infinite; }
    .b1     { animation: beat 3s ease-in-out infinite; }
    .b2     { animation: beat 3s ease-in-out 1.2s infinite; }
    @keyframes breathe { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.2px); } }
    @keyframes beat   { 0%, 4% { opacity: .45; } 12%, 34% { opacity: .95; } 44%, 100% { opacity: .45; } }
    @keyframes glitch { 0%, 30% { transform: translateX(0); } 31% { transform: translateX(-5px); }
                        32% { transform: translateX(4px); }
                        33% { transform: translateX(-2px) skewX(20deg); } 34% { transform: translateX(6px); } 35% { transform: translateX(-3px) skewX(-15deg); }
                        36%, 100% { transform: translateX(0); } }
    @keyframes bsod   { 0%, 37% { opacity: 0; } 38%, 77% { opacity: 1; } 78%, 100% { opacity: 0; } }
    @keyframes freeze { 0%, 37% { transform: translateY(0); } 38% { transform: translateY(-3px); }
                        40%, 77% { transform: translateY(0); }
                        78%, 100% { transform: translateY(0); } }
    @keyframes look   { 0%, 37% { transform: translate(3px, -2px) scale(1); }
                        39%, 52% { transform: translate(3px, -2.6px) scale(.55); }
                        58%, 70% { transform: translate(-3px, 2px) scale(.55); } 76% { transform: translate(3px, -2px) scale(.55); }
                        80%, 100% { transform: translate(3px, -2px) scale(1); } }
    @keyframes sweat  { 0%, 42% { opacity: 0; transform: translateY(0); } 46% { opacity: .9; }
                        74% { opacity: .9; transform: translateY(10px); } 78%, 100% { opacity: 0; transform: translateY(10px); } }
    @keyframes tilt   { 0%, 44% { transform: rotate(0); } 50%, 74% { transform: rotate(-16deg); }
                        80%, 100% { transform: rotate(0); } }
  </style>
  <ellipse class="shadow" cx="55" cy="88" rx="15" ry="4"/>
  <g class="screen">
    <rect class="page" x="40" y="9" width="44" height="40" rx="3.5"/>
    <g class="bands">
      <rect class="line b1" x="46" y="16" width="32" height="3.2" rx="1.6"/>
      <rect class="line b2" x="46" y="23" width="24" height="3.2" rx="1.6"/>
    </g>
    <rect class="bsod" x="41" y="10" width="42" height="38" rx="2.5"/>
    <text class="sad" x="62" y="23.5" text-anchor="middle">:(</text>
  </g>
  <g class="rig">
    <g class="sprout"><path class="stem" d="M48 26.5 V18.5"/><path class="leaf" d="M48 20.5 C43 20.6, 39.4 17.6, 38.5 13.5 C43.2 13, 47.2 15.6, 48 20.5 Z"/><path class="leaf" d="M48 18.2 C53.2 17.6, 57.6 14, 58.5 9.5 C53.2 9.5, 48.8 13, 48 18.2 Z"/></g>
    <rect class="hull" x="17" y="27" width="62" height="54" rx="19"/>
    <g><circle class="iris" cx="36" cy="52" r="11"/><circle class="pupil" cx="36" cy="51" r="5"/></g>
    <g><circle class="iris" cx="60" cy="52" r="11"/><circle class="pupil" cx="60" cy="51" r="5"/></g>
    <path class="sweat" d="M73 32 C70.5 36, 70 38.5, 73 39.5 C76 38.5, 75.5 36, 73 32 Z"/>
    <path class="sweat" style="animation-delay:.5s" d="M22.5 35 C20 39, 19.5 41.5, 22.5 42.5 C25.5 41.5, 25 39, 22.5 35 Z"/>
  </g>
  <g class="who">
    <circle class="head" cx="27" cy="78" r="7.8"/>
    <path d="M12.4 101 a14.6 14.6 0 0 1 29.2 0 Z"/>
  </g>
</svg>
