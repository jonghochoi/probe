    <circle class="dot" cx="782" cy="44" r="2.6"/>
    <g class="lock l3" style="transform-origin:782px 44px"><circle class="hit" cx="782" cy="44" r="3.2"/><circle class="ring" cx="782" cy="44" r="7.5"/><path class="ring" d="M771 44 h4 M789 44 h4 M782 33 v4 M782 51 v4"/></g>
    <circle class="dot" cx="806" cy="44" r="2.6"/>
    <circle class="dot" cx="830" cy="44" r="2.6"/>
