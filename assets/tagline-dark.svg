    <circle class="dot" cx="638" cy="62" r="2.6"/>
    <circle class="dot" cx="662" cy="62" r="2.6"/>
    <circle class="dot" cx="686" cy="62" r="2.6"/>
    <circle class="dot" cx="710" cy="62" r="2.6"/>
    <g class="lock l2" style="transform-origin:710px 62px"><circle class="hit" cx="710" cy="62" r="3.2"/><circle class="ring" cx="710" cy="62" r="7.5"/><path class="ring" d="M699 62 h4 M717 62 h4 M710 51 v4 M710 69 v4"/></g>
