<svg xmlns="http://www.w3.org/2000/svg" width="72" height="96" viewBox="12 0 72 96" role="img" aria-label="PROBE — eyes darting between two papers, faster each time, until it circles the one place they differ">
  <style>
    .hull   { fill: #D97757; }
    .iris   { fill: #FFFAF7; }
    .pupil  { fill: #2A1A12; }
    .stem   { stroke: #CC785C; stroke-width: 3.6; stroke-linecap: round; fill: none; }
    .leaf   { fill: #CC785C; }
    .sprout { transform-origin: 48px 27px; animation: sway 3.2s ease-in-out infinite; }
    .page   { fill: #FFFAF7; stroke: #B06749; stroke-width: 2; }
    .line   { fill: #B06749; opacity: .3; }
    .shadow { fill: #CC785C; opacity: .55; }
    @keyframes sway { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
    @keyframes bob  { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

    .bar    { fill: #B06749; opacity: .55; }
    .ring   { fill: none; stroke: #E5484D; stroke-width: 2.4; stroke-linecap: round;
              stroke-dasharray: 100; stroke-dashoffset: 100; opacity: 0; animation: draw 5.6s ease-out infinite; }
    .rig    { animation: bob 4.2s ease-in-out infinite; }
    .hop    { animation: hop 5.6s ease-out infinite; }
    .turn   { transform-origin: 48px 81px; animation: turn 5.6s ease-in-out infinite; }
    .pupil  { transform-box: fill-box; transform-origin: center; transform: translate(4.2px, 2.4px);
              animation: look 5.6s ease-in-out infinite; }
    @keyframes look { 0%, 96%, 100% { transform: translate(4.2px, 2.4px) scale(1); }
                      2%, 14%, 28%, 36%, 46%, 50.5%, 57%, 59.5%, 63.5%, 64.5% { transform: translate(-4.2px, 2.4px) scale(1); }
                      16%, 26%, 38%, 44%, 52.5%, 55.5%, 61%, 62.5%, 65.2%, 66% { transform: translate(4.2px, 2.4px) scale(1); }
                      67.5%, 88% { transform: translate(0, -.5px) scale(.55); } }
    @keyframes turn { 0%, 96%, 100% { transform: rotate(5deg); }
                      2%, 14%, 28%, 36%, 46%, 50.5%, 57%, 59.5%, 63.5%, 64.5% { transform: rotate(-5deg); }
                      16%, 26%, 38%, 44%, 52.5%, 55.5%, 61%, 62.5%, 65.2%, 66% { transform: rotate(5deg); }
                      67.5%, 88% { transform: rotate(0); } }
    @keyframes draw { 0%, 66% { stroke-dashoffset: 100; opacity: 0; } 66.4% { stroke-dashoffset: 97; opacity: 1; }
                      71%, 89% { stroke-dashoffset: 0; opacity: 1; } 93%, 100% { stroke-dashoffset: 0; opacity: 0; } }
    @keyframes hop  { 0%, 66% { transform: translateY(0); } 68.5% { transform: translateY(-4px); }
                      71.5% { transform: translateY(0); } 73% { transform: translateY(-1.2px); } 74.5%, 100% { transform: translateY(0); } }
  </style>
  <ellipse class="shadow" cx="48" cy="90" rx="20" ry="4"/>
  <g class="rig"><g class="hop">
    <g class="turn">
      <g class="sprout"><path class="stem" d="M48 26.5 V18.5"/><path class="leaf" d="M48 20.5 C43 20.6, 39.4 17.6, 38.5 13.5 C43.2 13, 47.2 15.6, 48 20.5 Z"/><path class="leaf" d="M48 18.2 C53.2 17.6, 57.6 14, 58.5 9.5 C53.2 9.5, 48.8 13, 48 18.2 Z"/></g>
      <rect class="hull" x="17" y="27" width="62" height="54" rx="19"/>
      <circle class="iris" cx="36" cy="52" r="11"/><circle class="pupil" cx="36" cy="52" r="5"/>
      <circle class="iris" cx="60" cy="52" r="11"/><circle class="pupil" cx="60" cy="52" r="5"/>
    </g>
    <g transform="rotate(-6 33 86)">
      <rect class="page" x="21" y="60" width="24" height="26" rx="2.5"/><rect class="line" x="25.5" y="64" width="15" height="2.2" rx="1.1"/>
      <rect class="bar" x="26" y="76" width="3.8" height="6" rx=".8"/><rect class="bar" x="31.6" y="72" width="3.8" height="10" rx=".8"/><rect class="bar" x="37.2" y="67" width="3.8" height="15" rx=".8"/>
      <ellipse class="ring" cx="37.1" cy="74" rx="5.4" ry="10" transform="rotate(-10 37.1 74)" pathLength="100"/>
    </g>
    <g transform="rotate(6 63 86)">
      <rect class="page" x="51" y="60" width="24" height="26" rx="2.5"/><rect class="line" x="55.5" y="64" width="15" height="2.2" rx="1.1"/>
      <rect class="bar" x="56" y="76" width="3.8" height="6" rx=".8"/><rect class="bar" x="61.6" y="72" width="3.8" height="10" rx=".8"/><rect class="bar" x="67.2" y="78" width="3.8" height="4" rx=".8"/>
      <ellipse class="ring" cx="67.1" cy="74" rx="5.4" ry="10" transform="rotate(-10 67.1 74)" pathLength="100"/>
    </g>
  </g></g>
</svg>
