<svg xmlns="http://www.w3.org/2000/svg" width="72" height="96" viewBox="12 0 72 96" role="img" aria-label="PROBE — watching two papers rally a ball until it bumps its head">
  <style>
    .hull   { fill: #D97757; }
    .iris   { fill: #FFFAF7; }
    .pupil  { fill: #2A1A12; }
    .stem   { stroke: #CC785C; stroke-width: 3.6; stroke-linecap: round; fill: none; }
    .leaf   { fill: #CC785C; }
    .sprout { transform-origin: 48px 27px; animation: sway 3.2s ease-in-out infinite; }
    .page   { fill: #FFFAF7; stroke: #B06749; stroke-width: 2; }
    .line   { fill: #B06749; opacity: .3; }
    .shadow { fill: #CC785C; opacity: .55; }
    @keyframes sway { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
    @keyframes bob  { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

    .ball   { fill: #F5B700; stroke: #C78F00; stroke-width: 1.4; }
    .hit    { stroke: #2A1A12; stroke-width: 1.8; stroke-linecap: round; fill: none; opacity: 0; }
    .pL     { transform-origin: 27px 82px; animation: hitL 5.2s linear infinite; }
    .pR     { transform-origin: 69px 82px; animation: hitR 5.2s linear infinite; }
    @keyframes hitL { 0%, 2%, 32%, 35%, 51%, 54% { transform: rotate(0); }
                      1%, 33.5%, 52.5% { transform: rotate(-9deg); }
                      61%, 63% { transform: rotate(0); } 62% { transform: rotate(-9deg); } 100% { transform: rotate(0); } }
    @keyframes hitR { 0%, 17%, 20%, 42%, 45%, 56%, 58%, 100% { transform: rotate(0); }
                      18.5%, 43.5%, 57% { transform: rotate(9deg); } }
    @keyframes hit  { 0%, 65% { opacity: 0; transform: scale(.5); } 66% { opacity: 1; transform: scale(1); }
                      72% { opacity: 1; transform: scale(1.25); } 75%, 100% { opacity: 0; transform: scale(1.25); } }

    .lump   { fill: #E8654A; }
    .shine  { fill: #FFFFFF; opacity: .5; }
    .rig    { animation: bob 4.2s ease-in-out infinite; }
    .bg     { transform: translate(48px, 60px); animation: ball 5.2s linear infinite; }
    .pupil  { transform-box: fill-box; transform-origin: center; animation: follow 5.2s ease-in-out infinite; }
    .bump   { transform: scale(0); transform-origin: 36px 30px; animation: swell 5.2s ease-out infinite; }
    .knock  { transform-origin: 48px 81px; animation: knock 5.2s ease-out infinite; }
    .hits   { opacity: 0; transform-origin: 36px 23px; animation: hit 5.2s ease-out infinite; }
    .hits path { opacity: 1; }
    @keyframes ball   { 0% { transform: translate(30px, 68px); } 4.5% { transform: translate(39px, 61.25px); }
                        9% { transform: translate(48px, 59px); } 13.5% { transform: translate(57px, 61.25px); }
                        18% { transform: translate(66px, 68px); } 21.5% { transform: translate(57px, 61.25px); }
                        25% { transform: translate(48px, 59px); } 28.5% { transform: translate(39px, 61.25px); }
                        32% { transform: translate(30px, 68px); } 34.75% { transform: translate(39px, 61.25px); }
                        37.5% { transform: translate(48px, 59px); } 40.25% { transform: translate(57px, 61.25px); }
                        43% { transform: translate(66px, 68px); } 45% { transform: translate(57px, 61.25px); }
                        47% { transform: translate(48px, 59px); } 49% { transform: translate(39px, 61.25px); }
                        51% { transform: translate(30px, 68px); } 52.5% { transform: translate(39px, 61.25px); }
                        54% { transform: translate(48px, 59px); } 55.5% { transform: translate(57px, 61.25px); }
                        57% { transform: translate(66px, 68px); } 58.25% { transform: translate(57px, 61.25px); }
                        59.5% { transform: translate(48px, 59px); } 60.75% { transform: translate(39px, 61.25px); }
                        62% { transform: translate(30px, 68px); } 66% { transform: translate(37px, 28px); }
                        69% { transform: translate(31px, 40px); } 73% { transform: translate(27px, 86px); }
                        77% { transform: translate(30px, 79px); } 80% { transform: translate(33px, 86px); }
                        82% { transform: translate(34.5px, 83.5px); } 84% { transform: translate(36px, 86px); }
                        90% { transform: translate(38px, 86px); opacity: 1; }
                        93% { transform: translate(38px, 86px); opacity: 0; }
                        100% { transform: translate(30px, 68px); opacity: 0; } }
    @keyframes follow { 0% { transform: translateX(-3.4px); } 18% { transform: translateX(3.4px); }
                        32% { transform: translateX(-3.4px); } 43% { transform: translateX(3.4px); }
                        51% { transform: translateX(-3.4px); } 57% { transform: translateX(3.4px); }
                        62% { transform: translateX(-3.4px) scale(1); }
                        65% { transform: translate(-1px, -3.5px) scale(1); }
                         68%, 70%, 72% { transform: translate(-1px, -3px) scale(.5); } 69%, 71% { transform: translate(.6px, -3px) scale(.5); }
                         74%, 88% { transform: translate(-2.4px, 2.6px) scale(.6); } 96%, 100% { transform: translateX(-3.4px) scale(1); } }
    @keyframes swell  { 0%, 66% { transform: scale(0); } 69% { transform: scale(1.25); }
                        72% { transform: scale(.92); }
                         75%, 90% { transform: scale(1); } 96%, 100% { transform: scale(0); } }
    @keyframes knock  { 0%, 65% { transform: rotate(0); } 67% { transform: rotate(7deg); }
                        70% { transform: rotate(-3deg); }
                         73% { transform: rotate(1deg); } 76%, 100% { transform: rotate(0); } }
  </style>
  <ellipse class="shadow" cx="48" cy="90" rx="20" ry="4"/>
  <g class="rig"><g class="knock">
    <g class="bump"><circle class="lump" cx="36" cy="26" r="8"/><path class="shine" d="M31.4 23.6 a5.2 5.2 0 0 1 3.9 -3.4 l.4 1.6 a3.6 3.6 0 0 0 -2.7 2.4 z"/></g>
    <g class="sprout"><path class="stem" d="M48 26.5 V18.5"/><path class="leaf" d="M48 20.5 C43 20.6, 39.4 17.6, 38.5 13.5 C43.2 13, 47.2 15.6, 48 20.5 Z"/><path class="leaf" d="M48 18.2 C53.2 17.6, 57.6 14, 58.5 9.5 C53.2 9.5, 48.8 13, 48 18.2 Z"/></g>
    <rect class="hull" x="17" y="27" width="62" height="54" rx="19"/>
    <circle class="iris" cx="36" cy="52" r="11"/><circle class="pupil" cx="36" cy="55" r="5"/>
    <circle class="iris" cx="60" cy="52" r="11"/><circle class="pupil" cx="60" cy="55" r="5"/>
    <g class="pL"><rect class="page" x="17" y="62" width="15" height="20" rx="2.5"/>
      <rect class="line" x="20.5" y="66.5" width="8" height="2.2" rx="1.1"/><rect class="line" x="20.5" y="71" width="6" height="2.2" rx="1.1"/></g>
    <g class="pR"><rect class="page" x="64" y="62" width="15" height="20" rx="2.5"/>
      <rect class="line" x="67.5" y="66.5" width="8" height="2.2" rx="1.1"/><rect class="line" x="67.5" y="71" width="6" height="2.2" rx="1.1"/></g>
  </g></g>
  <g class="hits"><path class="hit" d="M27.1 19.8 L23.8 18.6"/><path class="hit" d="M30.6 15.2 L28.5 12.4"/><path class="hit" d="M36.0 13.5 L36.0 10.0"/><path class="hit" d="M41.4 15.2 L43.5 12.4"/><path class="hit" d="M44.9 19.8 L48.2 18.6"/></g>
  <g class="bg"><circle class="ball" cx="0" cy="0" r="3.4"/></g>
</svg>
