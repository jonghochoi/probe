<svg xmlns="http://www.w3.org/2000/svg" width="272" height="96" viewBox="0 0 272 96" role="img" aria-label="PROBE — Research Scout">
  <style>
    .hull   { fill: #E8916F; }
    .iris   { fill: #FFF6F1; }
    .pupil  { fill: #2A1A12; }
    .joy    { fill: none; stroke: #2A1A12; stroke-width: 3.4; stroke-linecap: round; }
    .stalk  { stroke: #F0A183; stroke-width: 5; stroke-linecap: round; fill: none; }
    .beacon { fill: #F0A183; }
    .wave   { fill: none; stroke: #F0A183; stroke-width: 2.6;
              stroke-linecap: round; opacity: 0; }
    .shadow { fill: #F0A183; opacity: .55; }
    .rig   { animation: bob 3.4s ease-in-out infinite; }
    .w1    { animation: ping 2.6s ease-in-out infinite; }
    .w2    { animation: ping 2.6s ease-in-out .34s infinite; }
    .lid   { animation: blink 5.4s ease-in-out infinite; }
    .pupil { animation: mood-open 14s ease-in-out infinite; }
    .joy   { animation: mood-joy 14s ease-in-out infinite; }
    .eL, .eL .lid { transform-origin: 36px 52px; }
    .eR, .eR .lid { transform-origin: 60px 52px; }
    @keyframes bob   { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes ping  { 0%, 100% { opacity: 0; } 12%, 42% { opacity: .85; } 58% { opacity: 0; } }
    @keyframes blink { 0%, 88%, 100% { transform: scaleY(1); }
                       92% { transform: scaleY(.06); } 96% { transform: scaleY(1); } }
    @keyframes mood-open { 0%, 46%, 100% { opacity: 1; } 50%, 96% { opacity: 0; } }
    @keyframes mood-joy  { 0%, 46%, 100% { opacity: 0; } 50%, 96% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .rig, .lid, .pupil, .joy, .wave { animation: none; }
      .joy { opacity: 0; }
      .wave { opacity: .5; }
    }
  </style>

  <g transform="translate(4 2) scale(.92)">
      <ellipse class="shadow" cx="48" cy="90" rx="20" ry="4"/>
    <g class="rig">
      <path class="wave w1" d="M41.04 11.12 A8.5 8.5 0 0 1 54.96 11.12"/>
      <path class="wave w2" d="M36.94 8.25 A13.5 13.5 0 0 1 59.06 8.25"/>
      <path class="stalk" d="M48 26 V19"/>
      <circle class="beacon" cx="48" cy="16" r="5"/>
      <rect class="hull" x="17" y="27" width="62" height="54" rx="19"/>
      <g class="eye eL"><g class="lid"><circle class="iris" cx="36" cy="52" r="11"/><circle class="pupil" cx="36" cy="52" r="5"/><path class="joy" d="M30 54 a6.5 6.5 0 0 1 12 0"/></g></g>
      <g class="eye eR"><g class="lid"><circle class="iris" cx="60" cy="52" r="11"/><circle class="pupil" cx="60" cy="52" r="5"/><path class="joy" d="M54 54 a6.5 6.5 0 0 1 12 0"/></g></g>
    </g>
  </g>

  <text x="106" y="55" fill="#F5EEE9" letter-spacing="-1"
        font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace"
        font-size="42" font-weight="700">PROBE</text>
  <text x="108" y="79" fill="#E0A88C" letter-spacing="3.4"
        font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace"
        font-size="12">RESEARCH SCOUT</text>
</svg>
