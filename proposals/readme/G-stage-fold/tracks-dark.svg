  <text class="what" x="88.0" y="192" text-anchor="middle">3–5 papers a run</text>
  <g transform="translate(219.51999999999998 20) scale(0.92)">
    <ellipse class="shadow" cx="48" cy="90" rx="20" ry="4"/><g class="rig">
      
      <path class="stalk" d="M48 26 V19"/><circle class="beacon" cx="48" cy="16" r="5"/>
      <rect class="hull" x="17" y="27" width="62" height="54" rx="19"/>
      <g class="lid"><circle class="iris" cx="36" cy="52" r="11"/><g class="readp"><circle class="pupil" cx="36" cy="56.5" r="5"/></g></g><g class="lid"><circle class="iris" cx="60" cy="52" r="11"/><g class="readp"><circle class="pupil" cx="60" cy="56.5" r="5"/></g></g>
      <g transform="rotate(-5 48 75.5)">
        <rect class="page" x="25" y="67" width="46" height="17" rx="3"/>
        <rect class="line l1" x="31" y="70.6" width="34" height="2.2" rx="1.1"/>
        <rect class="line l2" x="31" y="74.4" width="34" height="2.2" rx="1.1"/>
        <rect class="line l3" x="31" y="78.2" width="22" height="2.2" rx="1.1"/>
      </g>
      
    </g>
  </g>
  <text class="name" x="264.0" y="150" text-anchor="middle">analysis</text>
  <text class="cmd" x="264.0" y="171" text-anchor="middle">/analyze</text>
  <text class="what" x="264.0" y="192" text-anchor="middle">one paper, in Korean</text>
  <line class="sep" x1="176" y1="134" x2="176" y2="198"/>
  <g transform="translate(395.52 20) scale(0.92)">
    <ellipse class="shadow" cx="48" cy="90" rx="20" ry="4"/><g class="rig">
      
      <path class="stalk" d="M48 26 V19"/><circle class="beacon" cx="48" cy="16" r="5"/>
      <rect class="hull" x="17" y="27" width="62" height="54" rx="19"/>
      <g class="lid"><circle class="iris" cx="36" cy="52" r="11"/><g class="readp"><circle class="pupil" cx="36" cy="55" r="5"/></g></g><g class="lid"><circle class="iris" cx="60" cy="52" r="11"/><g class="readp"><circle class="pupil" cx="60" cy="55" r="5"/></g></g>
      
      
    </g>
  </g><g transform="translate(395.52 20) scale(0.92)">
      <g class="up"><rect class="pg" x="20" y="66" width="26" height="18" rx="3"/><rect class="line" x="25" y="71" width="16" height="2.2"/><rect class="line" x="25" y="76" width="12" height="2.2"/></g>
      <g class="dn"><rect class="pg" x="50" y="66" width="26" height="18" rx="3"/><rect class="line" x="55" y="71" width="16" height="2.2"/><rect class="line" x="55" y="76" width="12" height="2.2"/></g></g>
  <text class="name" x="440.0" y="150" text-anchor="middle">comparison</text>
  <text class="cmd" x="440.0" y="171" text-anchor="middle">/compare</text>
  <text class="what" x="440.0" y="192" text-anchor="middle">where 2–3 part</text>
  <line class="sep" x1="352" y1="134" x2="352" y2="198"/>
  <g transform="translate(571.52 20) scale(0.92)">
      <rect class="scr" x="56" y="-4" width="46" height="36" rx="3"/>
      <rect class="band bd1" x="62" y="3" width="34" height="5" rx="1.5"/>
      <rect class="band bd2" x="62" y="12" width="34" height="5" rx="1.5"/>
      <rect class="band bd3" x="62" y="21" width="22" height="5" rx="1.5"/></g><g transform="translate(561.52 20) scale(0.92)">
    <ellipse class="shadow" cx="48" cy="90" rx="20" ry="4"/><g class="rig">
      
      <path class="stalk" d="M48 26 V19"/><circle class="beacon" cx="48" cy="16" r="5"/>
      <rect class="hull" x="17" y="27" width="62" height="54" rx="19"/>
      <g class="lid"><circle class="iris" cx="36" cy="52" r="11"/><circle class="pupil" cx="33" cy="56" r="5"/></g><g class="lid"><circle class="iris" cx="60" cy="52" r="11"/><circle class="pupil" cx="57" cy="56" r="5"/></g>
      
      
    </g>
  </g><g transform="translate(539.52 64) scale(0.42)">
