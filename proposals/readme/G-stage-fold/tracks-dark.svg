      <g class="lid"><circle class="iris" cx="36" cy="52" r="11"/><circle class="pupil" cx="38.5" cy="48" r="5"/></g><g class="lid"><circle class="iris" cx="60" cy="52" r="11"/><circle class="pupil" cx="62.5" cy="48" r="5"/></g>
      
      
