<svg xmlns="http://www.w3.org/2000/svg" width="880" height="260" viewBox="0 0 880 260" role="img" aria-label="100 papers a day on cs.RO + cs.LG, 3–5 a week that touch dexterous hands, 1 page you finish in one sitting, in Korean">
  <style>
    .hull   { fill: #E8916F; }
    .iris   { fill: #FFF6F1; }
    .pupil  { fill: #2A1A12; }
    .lids   { fill: none; stroke: #2A1A12; stroke-width: 3.4; stroke-linecap: round; }
    .stalk  { stroke: #F0A183; stroke-width: 5; stroke-linecap: round; fill: none; }
    .beacon { fill: #F0A183; }
    .page   { fill: #FFF6F1; stroke: #C98A6D; stroke-width: 2; }
    .line   { fill: #C98A6D; opacity: .3; }
    .wave   { fill: none; stroke: #F0A183; stroke-width: 2.6; stroke-linecap: round; opacity: 0; }
    .shadow { fill: #F0A183; opacity: .45; }
    .dim    { fill: #6E625B; }
    .dimst  { stroke: #5E534C; stroke-width: 5; stroke-linecap: round; fill: none; }
    .dimbe  { fill: #5E534C; }
    .cross  { fill: none; stroke: #2A211C; stroke-width: 3.2; stroke-linecap: round; }
    .mug    { fill: #FFF6F1; stroke: #C98A6D; stroke-width: 2; stroke-linejoin: round; }
    .handle { fill: none; stroke: #C98A6D; stroke-width: 2.4; stroke-linecap: round; }
    .brew   { fill: #C98A6D; }
    .steam  { fill: none; stroke: #F0A183; stroke-width: 2.2; stroke-linecap: round; opacity: 0; }
    .z      { fill: #C98A6D; font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; font-weight: 700; }
    .rig    { animation: bob 3.4s ease-in-out infinite; }
    .lid    { transform-box: fill-box; transform-origin: 50% 50%;
              animation: blink 7s ease-in-out infinite; }
    .readp  { animation: read 3.6s ease-in-out infinite; }
    .sweepp { animation: sweep 3.2s ease-in-out infinite; }
    .w1     { animation: ping 2.6s ease-in-out infinite; }
    .w2     { animation: ping 2.6s ease-in-out .34s infinite; }
    .l1     { animation: lit 4.8s ease-in-out infinite; }
    .l2     { animation: lit 4.8s ease-in-out 1.6s infinite; }
    .l3     { animation: lit 4.8s ease-in-out 3.2s infinite; }
    .s1     { animation: steam 3.8s ease-in-out infinite; }
    .s2     { animation: steam 3.8s ease-in-out 1.9s infinite; }
    .z1     { animation: rise 2.8s ease-in-out infinite; }
    .z2     { animation: rise 2.8s ease-in-out .5s infinite; }
    .z3     { animation: rise 2.8s ease-in-out 1s infinite; }
    .drift  { transform-box: fill-box; transform-origin: 50% 100%;
              animation: drift 4.6s ease-in-out infinite; }
    @keyframes bob   { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes blink { 0%, 44%, 50%, 100% { transform: scaleY(1); } 47% { transform: scaleY(.08); } }
    @keyframes read  { 0% { transform: translateX(-2.4px); } 72% { transform: translateX(2.4px); }
                       86%, 100% { transform: translateX(-2.4px); } }
    @keyframes sweep { 0%, 100% { transform: translateX(-3px); } 50% { transform: translateX(3px); } }
    @keyframes ping  { 0%, 100% { opacity: 0; } 12%, 42% { opacity: .85; } 58% { opacity: 0; } }
    @keyframes lit   { 0%, 28% { opacity: .95; } 34%, 100% { opacity: .3; } }
    @keyframes steam { 0% { opacity: 0; transform: translateY(2px); } 30%, 55% { opacity: .7; }
                       100% { opacity: 0; transform: translateY(-6px); } }
    @keyframes rise  { 0% { opacity: 0; transform: translate(0, 4px); } 30%, 70% { opacity: 1; }
                       100% { opacity: 0; transform: translate(4px, -8px); } }
    @keyframes drift { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }

    .num  { font: 700 76px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; letter-spacing: -3px; }
    .n0   { fill: #6E625B; }
    .n1   { fill: #C98A6D; }
    .n2   { fill: #E8916F; }
    .lab  { fill: #F2EAE4; font: 600 16px system-ui, -apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
    .sub  { fill: #A08D80; font: 14px system-ui, -apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
    .base { fill: #332B26; }
    .bar  { fill: #E8916F; transform-box: fill-box; transform-origin: 0 50%; transform: scaleX(0); }
    .b0   { fill: #6E625B; animation: fill0 9s ease-in-out infinite; }
    .b1   { fill: #C98A6D; animation: fill1 9s ease-in-out infinite; }
    .b2   { animation: fill2 9s ease-in-out infinite; }
    .chev { fill: none; stroke: #E8916F; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round;
            animation: chev 1.8s ease-in-out infinite; }
    @keyframes fill0 { 0% { transform: scaleX(0); } 18%, 90% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
    @keyframes fill1 { 0%, 22% { transform: scaleX(0); } 40%, 90% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
    @keyframes fill2 { 0%, 44% { transform: scaleX(0); } 62%, 90% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
    @keyframes chev  { 0%, 100% { transform: translateX(0); opacity: .5; } 50% { transform: translateX(4px); opacity: 1; } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
<g transform="translate(16 6) scale(0.78)">
    <ellipse class="dimbe" opacity=".45" cx="48" cy="90" rx="20" ry="4"/><g class="drift">
      <path class="dimst" d="M48 26 q-2 -6 -8 -7"/><circle class="dimbe" cx="39" cy="18" r="5"/>
      <rect class="dim" x="17" y="27" width="62" height="54" rx="19"/><circle class="iris" cx="36" cy="52" r="11"/><path class="cross" d="M30.5 46.5 L41.5 57.5 M41.5 46.5 L30.5 57.5"/><circle class="iris" cx="60" cy="52" r="11"/><path class="cross" d="M54.5 46.5 L65.5 57.5 M65.5 46.5 L54.5 57.5"/></g>
  </g>
  <text class="num n0" x="24" y="170">100</text>
  <rect class="base" x="26" y="188" width="236" height="3" rx="1.5"/>
  <rect class="bar b0" x="26" y="188" width="236" height="3" rx="1.5"/>
  <text class="lab" x="26" y="220">papers a day</text>
  <text class="sub" x="26" y="242">on cs.RO + cs.LG</text>
  <g transform="translate(310 6) scale(0.78)">
    <ellipse class="shadow" cx="48" cy="90" rx="20" ry="4"/><g class="rig">
      <path class="wave w1" d="M41.04 11.12 A8.5 8.5 0 0 1 54.96 11.12"/>
      <path class="wave w2" d="M36.94 8.25 A13.5 13.5 0 0 1 59.06 8.25"/>
      <path class="stalk" d="M48 26 V19"/><circle class="beacon" cx="48" cy="16" r="5"/>
      <rect class="hull" x="17" y="27" width="62" height="54" rx="19"/>
      <g class="lid"><circle class="iris" cx="36" cy="52" r="11"/><g class="sweepp"><circle class="pupil" cx="36" cy="52" r="5"/></g></g><g class="lid"><circle class="iris" cx="60" cy="52" r="11"/><g class="sweepp"><circle class="pupil" cx="60" cy="52" r="5"/></g></g>
      
      
    </g>
  </g>
  <text class="num n1" x="318" y="170">3–5</text>
  <rect class="base" x="320" y="188" width="236" height="3" rx="1.5"/>
  <rect class="bar b1" x="320" y="188" width="236" height="3" rx="1.5"/>
  <text class="lab" x="320" y="220">a week that touch</text>
  <text class="sub" x="320" y="242">dexterous hands</text>
  <g transform="translate(604 6) scale(0.78)">
    <ellipse class="shadow" cx="48" cy="90" rx="20" ry="4"/><g class="rig">
      
      <path class="stalk" d="M48 26 V19"/><circle class="beacon" cx="48" cy="16" r="5"/>
      <rect class="hull" x="17" y="27" width="62" height="54" rx="19"/>
      <g class="lid"><circle class="iris" cx="36" cy="52" r="11"/><g class="readp"><circle class="pupil" cx="36" cy="56.5" r="5"/></g></g><g class="lid"><circle class="iris" cx="60" cy="52" r="11"/><g class="readp"><circle class="pupil" cx="60" cy="56.5" r="5"/></g></g>
      <g transform="rotate(-5 48 75.5)">
        <rect class="page" x="25" y="67" width="46" height="17" rx="3"/>
        <rect class="line l1" x="31" y="70.6" width="34" height="2.2" rx="1.1"/>
        <rect class="line l2" x="31" y="74.4" width="34" height="2.2" rx="1.1"/>
        <rect class="line l3" x="31" y="78.2" width="22" height="2.2" rx="1.1"/>
      </g>
      
    </g><g><ellipse class="shadow" cx="91.5" cy="90" rx="9.4" ry="2.6"/>
      <path class="steam s1" d="M87.6 63 c-3 -3.2 3 -5.2 0 -8.6"/>
      <path class="steam s2" d="M95 62 c-3 -3.2 3 -5.2 0 -8.6"/>
      <path class="handle" d="M99.6 72.6 a5 5 0 0 1 0 9.6"/>
      <path class="mug" d="M83 68 h17 l-1.9 17.4 a3.2 3.2 0 0 1 -3.2 3.1 h-6.8 a3.2 3.2 0 0 1 -3.2 -3.1 Z"/>
      <ellipse class="brew" cx="91.5" cy="68" rx="8.5" ry="2.5"/></g>
  </g>
  <text class="num n2" x="612" y="170">1</text>
  <rect class="base" x="614" y="188" width="236" height="3" rx="1.5"/>
  <rect class="bar b2" x="614" y="188" width="236" height="3" rx="1.5"/>
  <text class="lab" x="614" y="220">page you finish</text>
  <text class="sub" x="614" y="242">in one sitting, in Korean</text>
  <g class="chev"><path class="chev" d="M278 128 l9 9 -9 9"/></g>
  <g class="chev"><path class="chev" d="M572 128 l9 9 -9 9"/></g>
</svg>
