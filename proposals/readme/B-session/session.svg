<svg xmlns="http://www.w3.org/2000/svg" width="880" height="404" viewBox="0 0 880 404" role="img" aria-label="A PROBE session — /analyze writes a Korean rewrite, /compare writes a comparison">
  <style>
    .hull   { fill: #D97757; }
    .iris   { fill: #FFFAF7; }
    .pupil  { fill: #2A1A12; }
    .lids   { fill: none; stroke: #2A1A12; stroke-width: 3.4; stroke-linecap: round; }
    .stalk  { stroke: #CC785C; stroke-width: 5; stroke-linecap: round; fill: none; }
    .beacon { fill: #CC785C; }
    .page   { fill: #FFFAF7; stroke: #B06749; stroke-width: 2; }
    .line   { fill: #B06749; opacity: .3; }
    .wave   { fill: none; stroke: #CC785C; stroke-width: 2.6; stroke-linecap: round; opacity: 0; }
    .shadow { fill: #CC785C; opacity: .45; }
    .dim    { fill: #C4B6AE; }
    .dimst  { stroke: #B3A49B; stroke-width: 5; stroke-linecap: round; fill: none; }
    .dimbe  { fill: #B3A49B; }
    .cross  { fill: none; stroke: #6B5A50; stroke-width: 3.2; stroke-linecap: round; }
    .mug    { fill: #FFFAF7; stroke: #B06749; stroke-width: 2; stroke-linejoin: round; }
    .handle { fill: none; stroke: #B06749; stroke-width: 2.4; stroke-linecap: round; }
    .brew   { fill: #B06749; }
    .steam  { fill: none; stroke: #CC785C; stroke-width: 2.2; stroke-linecap: round; opacity: 0; }
    .z      { fill: #B06749; font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; font-weight: 700; }
    .rig    { animation: bob 3.4s ease-in-out infinite; }
    .lid    { transform-box: fill-box; transform-origin: 50% 50%;
              animation: blink 7s ease-in-out infinite; }
    .readp  { animation: read 3.6s ease-in-out infinite; }
    .sweepp { animation: sweep 3.2s ease-in-out infinite; }
    .w1     { animation: ping 2.6s ease-in-out infinite; }
    .w2     { animation: ping 2.6s ease-in-out .34s infinite; }
    .l1     { animation: lit 4.8s ease-in-out infinite; }
    .l2     { animation: lit 4.8s ease-in-out 1.6s infinite; }
    .l3     { animation: lit 4.8s ease-in-out 3.2s infinite; }
    .s1     { animation: steam 3.8s ease-in-out infinite; }
    .s2     { animation: steam 3.8s ease-in-out 1.9s infinite; }
    .z1     { animation: rise 2.8s ease-in-out infinite; }
    .z2     { animation: rise 2.8s ease-in-out .5s infinite; }
    .z3     { animation: rise 2.8s ease-in-out 1s infinite; }
    .drift  { transform-box: fill-box; transform-origin: 50% 100%;
              animation: drift 4.6s ease-in-out infinite; }
    @keyframes bob   { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes blink { 0%, 44%, 50%, 100% { transform: scaleY(1); } 47% { transform: scaleY(.08); } }
    @keyframes read  { 0% { transform: translateX(-2.4px); } 72% { transform: translateX(2.4px); }
                       86%, 100% { transform: translateX(-2.4px); } }
    @keyframes sweep { 0%, 100% { transform: translateX(-3px); } 50% { transform: translateX(3px); } }
    @keyframes ping  { 0%, 100% { opacity: 0; } 12%, 42% { opacity: .85; } 58% { opacity: 0; } }
    @keyframes lit   { 0%, 28% { opacity: .95; } 34%, 100% { opacity: .3; } }
    @keyframes steam { 0% { opacity: 0; transform: translateY(2px); } 30%, 55% { opacity: .7; }
                       100% { opacity: 0; transform: translateY(-6px); } }
    @keyframes rise  { 0% { opacity: 0; transform: translate(0, 4px); } 30%, 70% { opacity: 1; }
                       100% { opacity: 0; transform: translate(4px, -8px); } }
    @keyframes drift { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }

    .win   { fill: #1F1A17; }
    .edge  { fill: none; stroke: #D97757; }
    .bar   { fill: #9C8B80; opacity: .35; }
    .title { fill: #9C8B80; font: 12px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
    text.l { font: 15px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; white-space: pre; }
    .p     { fill: #D97757; font-weight: 700; }
    .c     { fill: #F2EAE4; font-weight: 700; }
    .k     { fill: #9C8B80; }
    .v     { fill: #F2EAE4; }
    .a     { fill: #D97757; }
    .ok    { fill: #D97757; font-weight: 700; }
    .cov   { fill: #1F1A17; }
    .cur   { fill: #D97757; animation: cur 1s steps(1, end) infinite; }
    @keyframes cur { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }

    .c0 { animation: t0 16s steps(1, end) infinite; }
    .c0 .cov { animation: k0 16s linear infinite; }
    @keyframes t0 { 0%, 2% { opacity: 0; } 2.01%, 92% { opacity: 1; } 94%, 100% { opacity: 0; } }
    @keyframes k0 { 0%, 4% { transform: translateX(0); animation-timing-function: steps(19, end); }
                     10.55% { transform: translateX(171.6px); }
                     10.56%, 100% { transform: translateX(880px); } }
    .c1 { animation: t1 16s steps(1, end) infinite; }
    @keyframes t1 { 0%, 14% { opacity: 0; } 14.01%, 92% { opacity: 1; } 94%, 100% { opacity: 0; } }
    .c2 { animation: t2 16s steps(1, end) infinite; }
    @keyframes t2 { 0%, 18% { opacity: 0; } 18.01%, 92% { opacity: 1; } 94%, 100% { opacity: 0; } }
    .c3 { animation: t3 16s steps(1, end) infinite; }
    @keyframes t3 { 0%, 24% { opacity: 0; } 24.01%, 92% { opacity: 1; } 94%, 100% { opacity: 0; } }
    .c4 { animation: t4 16s steps(1, end) infinite; }
    @keyframes t4 { 0%, 30% { opacity: 0; } 30.01%, 92% { opacity: 1; } 94%, 100% { opacity: 0; } }
    .c5 { animation: t5 16s steps(1, end) infinite; }
    .c5 .cov { animation: k5 16s linear infinite; }
    @keyframes t5 { 0%, 40% { opacity: 0; } 40.01%, 92% { opacity: 1; } 94%, 100% { opacity: 0; } }
    @keyframes k5 { 0%, 42% { transform: translateX(0); animation-timing-function: steps(41, end); }
                     58.45% { transform: translateX(370.2px); }
                     58.46%, 100% { transform: translateX(880px); } }
    .c6 { animation: t6 16s steps(1, end) infinite; }
    @keyframes t6 { 0%, 60% { opacity: 0; } 60.01%, 92% { opacity: 1; } 94%, 100% { opacity: 0; } }
    .c7 { animation: t7 16s steps(1, end) infinite; }
    @keyframes t7 { 0%, 66% { opacity: 0; } 66.01%, 92% { opacity: 1; } 94%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <clipPath id="clip"><rect x="0" y="70" width="880" height="334" rx="12"/></clipPath>
  <g transform="translate(716 2) scale(1.0)">
    <g class="rig">
      <path class="wave w1" d="M41.04 11.12 A8.5 8.5 0 0 1 54.96 11.12"/>
      <path class="wave w2" d="M36.94 8.25 A13.5 13.5 0 0 1 59.06 8.25"/>
      <path class="stalk" d="M48 26 V19"/><circle class="beacon" cx="48" cy="16" r="5"/>
      <rect class="hull" x="17" y="27" width="62" height="54" rx="19"/>
      <g class="lid"><circle class="iris" cx="36" cy="52" r="11"/><circle class="pupil" cx="33" cy="56" r="5"/></g><g class="lid"><circle class="iris" cx="60" cy="52" r="11"/><circle class="pupil" cx="57" cy="56" r="5"/></g>
      
      
    </g>
  </g>
  <rect class="win" x="0" y="70" width="880" height="334" rx="12"/>
  <rect class="edge" x=".5" y="70.5" width="879" height="333" rx="11.5"/>
  <circle class="bar" cx="26" cy="92" r="6"/><circle class="bar" cx="46" cy="92" r="6"/><circle class="bar" cx="66" cy="92" r="6"/>
  <text class="title" x="440.0" y="96" text-anchor="middle">claude · ~/probe</text>
  <g clip-path="url(#clip)">
    <g class="c0"><text class="l" x="40" y="132" xml:space="preserve"><tspan class="p">❯ </tspan><tspan class="c">/analyze 2609.15910</tspan></text><rect class="cov" x="56" y="114" width="880" height="24"/></g>
  <g class="c1"><text class="l" x="40" y="159" xml:space="preserve"><tspan class="k">  reads    </tspan><tspan class="v">context/MASTER.md</tspan></text></g>
  <g class="c2"><text class="l" x="40" y="186" xml:space="preserve"><tspan class="k">  fetches  </tspan><tspan class="v">arxiv.org/html/2609.15910</tspan></text></g>
  <g class="c3"><text class="l" x="40" y="213" xml:space="preserve"><tspan class="k">  writes   </tspan><tspan class="v">analysis/2609.15910.md</tspan><tspan class="a">   SlipSense</tspan></text></g>
  <g class="c4"><text class="l" x="40" y="240" xml:space="preserve"><tspan class="ok">  ✓ </tspan><tspan class="v">요약 + 본문, live on the reading site</tspan></text></g>
  <g class="c5"><text class="l" x="40" y="280" xml:space="preserve"><tspan class="p">❯ </tspan><tspan class="c">/compare 2606.17055 2607.07287 2608.01824</tspan></text><rect class="cov" x="56" y="262" width="880" height="24"/></g>
  <g class="c6"><text class="l" x="40" y="307" xml:space="preserve"><tspan class="k">  writes   </tspan><tspan class="v">comparison/fast-loop-without-vision.md</tspan></text></g>
  <g class="c7"><text class="l" x="40" y="334" xml:space="preserve"><tspan class="ok">  ✓ </tspan><tspan class="v">촉각 루프가 눈을 감은 채 행동 청크에 무엇을 할 수 있나</tspan></text></g>
