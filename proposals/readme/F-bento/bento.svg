<svg xmlns="http://www.w3.org/2000/svg" width="880" height="458" viewBox="0 0 880 458" role="img" aria-label="PROBE's tracks as tiles — scouting, analysis, comparison, presentation, ideation — the human-owned context, and the three questions every paper is asked">
  <style>
    .hull   { fill: #D97757; }
    .iris   { fill: #FFFAF7; }
    .pupil  { fill: #2A1A12; }
    .lids   { fill: none; stroke: #2A1A12; stroke-width: 3.4; stroke-linecap: round; }
    .stalk  { stroke: #CC785C; stroke-width: 5; stroke-linecap: round; fill: none; }
    .beacon { fill: #CC785C; }
    .page   { fill: #FFFAF7; stroke: #B06749; stroke-width: 2; }
    .line   { fill: #B06749; opacity: .3; }
    .wave   { fill: none; stroke: #CC785C; stroke-width: 2.6; stroke-linecap: round; opacity: 0; }
    .shadow { fill: #CC785C; opacity: .45; }
    .dim    { fill: #C4B6AE; }
    .dimst  { stroke: #B3A49B; stroke-width: 5; stroke-linecap: round; fill: none; }
    .dimbe  { fill: #B3A49B; }
    .cross  { fill: none; stroke: #6B5A50; stroke-width: 3.2; stroke-linecap: round; }
    .mug    { fill: #FFFAF7; stroke: #B06749; stroke-width: 2; stroke-linejoin: round; }
    .handle { fill: none; stroke: #B06749; stroke-width: 2.4; stroke-linecap: round; }
    .brew   { fill: #B06749; }
    .steam  { fill: none; stroke: #CC785C; stroke-width: 2.2; stroke-linecap: round; opacity: 0; }
    .z      { fill: #B06749; font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; font-weight: 700; }
    .rig    { animation: bob 3.4s ease-in-out infinite; }
    .lid    { transform-box: fill-box; transform-origin: 50% 50%;
              animation: blink 7s ease-in-out infinite; }
    .readp  { animation: read 3.6s ease-in-out infinite; }
    .sweepp { animation: sweep 3.2s ease-in-out infinite; }
    .w1     { animation: ping 2.6s ease-in-out infinite; }
    .w2     { animation: ping 2.6s ease-in-out .34s infinite; }
    .l1     { animation: lit 4.8s ease-in-out infinite; }
    .l2     { animation: lit 4.8s ease-in-out 1.6s infinite; }
    .l3     { animation: lit 4.8s ease-in-out 3.2s infinite; }
    .s1     { animation: steam 3.8s ease-in-out infinite; }
    .s2     { animation: steam 3.8s ease-in-out 1.9s infinite; }
    .z1     { animation: rise 2.8s ease-in-out infinite; }
    .z2     { animation: rise 2.8s ease-in-out .5s infinite; }
    .z3     { animation: rise 2.8s ease-in-out 1s infinite; }
    .drift  { transform-box: fill-box; transform-origin: 50% 100%;
              animation: drift 4.6s ease-in-out infinite; }
    @keyframes bob   { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes blink { 0%, 44%, 50%, 100% { transform: scaleY(1); } 47% { transform: scaleY(.08); } }
    @keyframes read  { 0% { transform: translateX(-2.4px); } 72% { transform: translateX(2.4px); }
                       86%, 100% { transform: translateX(-2.4px); } }
    @keyframes sweep { 0%, 100% { transform: translateX(-3px); } 50% { transform: translateX(3px); } }
    @keyframes ping  { 0%, 100% { opacity: 0; } 12%, 42% { opacity: .85; } 58% { opacity: 0; } }
    @keyframes lit   { 0%, 28% { opacity: .95; } 34%, 100% { opacity: .3; } }
    @keyframes steam { 0% { opacity: 0; transform: translateY(2px); } 30%, 55% { opacity: .7; }
                       100% { opacity: 0; transform: translateY(-6px); } }
    @keyframes rise  { 0% { opacity: 0; transform: translate(0, 4px); } 30%, 70% { opacity: 1; }
                       100% { opacity: 0; transform: translate(4px, -8px); } }
    @keyframes drift { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }

    .tile  { fill: #FFFCFA; stroke: #E8CDBD; stroke-width: 1.2; }
    .hot   { fill: #D97757; }
    .eb    { fill: #B06749; font: 10.5px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; letter-spacing: 2px; }
    .ti    { fill: #1F1611; font: 700 19px system-ui, -apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; letter-spacing: -.3px; }
    .tis   { fill: #1F1611; font: 700 16px system-ui, -apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
    .sb    { fill: #7A6A60; font: 13px system-ui, -apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
    .path  { fill: #1F1611; font: 700 12px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
    .note  { fill: #7A6A60; font: 12px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
    .ebh   { fill: #FFFAF7; opacity: .8; font: 10.5px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; letter-spacing: 2px; }
    .q     { fill: #FFFAF7; font: 700 15.5px system-ui, -apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
    .dot   { fill: #E8CDBD; }
    .keep  { fill: #E8CDBD; animation: keep 6s ease-in-out infinite; }
    .k2    { animation-delay: .9s; }
    .k3    { animation-delay: 1.8s; }
    .scanb { fill: #D97757; opacity: .08; animation: scanx 6s ease-in-out infinite; }
    .lock  { fill: none; stroke: #B06749; stroke-width: 2.4; stroke-linecap: round; }
    .lockb { fill: #B06749; }
    .doc   { fill: #FFFAF7; stroke: #E8CDBD; stroke-width: 1.5; }
    .frame { fill: none; stroke: #E8CDBD; stroke-width: 1; }
    .dl    { fill: #7A6A60; opacity: .3; }
    .qm    { transform-box: fill-box; transform-origin: 50% 50%; animation: qpop 4.5s ease-in-out infinite; }
    .q2    { animation-delay: .5s; }
    .q3    { animation-delay: 1s; }
    @keyframes keep  { 0%, 25% { fill: #E8CDBD; } 35%, 85% { fill: #D97757; } 100% { fill: #E8CDBD; } }
    @keyframes scanx { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(210px); } }
    @keyframes qpop  { 0%, 10% { opacity: .35; } 20%, 80% { opacity: 1; } 100% { opacity: .35; } }

    .name { fill: #1F1611; font: 700 15px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
    .cmd  { fill: #B06749; font: 12px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
    .when { fill: #7A6A60; font: 10px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; letter-spacing: 1.4px; }
    .pg   { fill: #FFFAF7; stroke: #B06749; stroke-width: 2; }
    .up   { animation: pan 3s ease-in-out infinite; }
    .dn   { animation: pan 3s ease-in-out 1.5s infinite; }
    .scr  { fill: #FFFCFA; stroke: #E8CDBD; stroke-width: 2; }
    .band { fill: #D97757; opacity: .25; }
    .bd1  { animation: lit 3.6s ease-in-out infinite; }
    .bd2  { animation: lit 3.6s ease-in-out 1.2s infinite; }
    .bd3  { animation: lit 3.6s ease-in-out 2.4s infinite; }
    .bub  { fill: #FFFAF7; stroke: #B06749; stroke-width: 1.6; }
    .bdot { fill: #B06749; opacity: .2; }
    .t1   { animation: think 2.4s ease-in-out infinite; }
    .t2   { animation: think 2.4s ease-in-out .3s infinite; }
    .t3   { animation: think 2.4s ease-in-out .6s infinite; }
    .sep  { stroke: #F2DFD3; stroke-width: 1.5; }
    @keyframes pan   { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @keyframes think { 0%, 100% { opacity: .2; } 40% { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
