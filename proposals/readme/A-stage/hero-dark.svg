      <path class="mug" d="M83 68 h17 l-1.9 17.4 a3.2 3.2 0 0 1 -3.2 3.1 h-6.8 a3.2 3.2 0 0 1 -3.2 -3.1 Z"/>
      <ellipse class="brew" cx="91.5" cy="68" rx="8.5" ry="2.5"/></g>
  </g>

</svg>
