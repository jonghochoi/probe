      <rect x="714" y="132" width="62" height="3.4" rx="1.7" class="hitl" opacity=".5"/>
      <rect x="690" y="152" width="150" height="24" rx="5" class="miss"/>
      <rect x="702" y="159" width="110" height="3.4" rx="1.7" class="missl"/>
      <rect x="702" y="166" width="70" height="3.4" rx="1.7" class="missl"/>
      <rect x="690" y="186" width="150" height="24" rx="5" class="miss"/>
      <rect x="702" y="193" width="96" height="3.4" rx="1.7" class="missl"/>
      <rect x="702" y="200" width="84" height="3.4" rx="1.7" class="missl"/>
      <rect x="690" y="220" width="150" height="24" rx="5" class="miss"/>
      <rect x="702" y="227" width="110" height="3.4" rx="1.7" class="missl"/>
      <rect x="702" y="234" width="70" height="3.4" rx="1.7" class="missl"/>
      <rect x="690" y="254" width="150" height="24" rx="5" class="hit"/>
      <circle cx="703" cy="266" r="4" class="dot"/>
      <rect x="714" y="261" width="96" height="3.4" rx="1.7" class="hitl"/>
      <rect x="714" y="268" width="62" height="3.4" rx="1.7" class="hitl" opacity=".5"/>
      <rect x="690" y="288" width="150" height="24" rx="5" class="miss"/>
      <rect x="702" y="295" width="110" height="3.4" rx="1.7" class="missl"/>
      <rect x="702" y="302" width="70" height="3.4" rx="1.7" class="missl"/>
      <rect x="690" y="322" width="150" height="24" rx="5" class="miss"/>
      <rect x="702" y="329" width="96" height="3.4" rx="1.7" class="missl"/>
      <rect x="702" y="336" width="84" height="3.4" rx="1.7" class="missl"/>
      <rect x="690" y="356" width="150" height="24" rx="5" class="miss"/>
      <rect x="702" y="363" width="110" height="3.4" rx="1.7" class="missl"/>
      <rect x="702" y="370" width="70" height="3.4" rx="1.7" class="missl"/>
      <rect x="690" y="390" width="150" height="24" rx="5" class="hit"/>
      <circle cx="703" cy="402" r="4" class="dot"/>
