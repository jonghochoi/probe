<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340" role="img" aria-label="PROBE — Stop drowning in arXiv. PROBE marks the target.">
  <style>
    .hull   { fill: #E8916F; }
    .iris   { fill: #FFF6F1; }
    .pupil  { fill: #2A1A12; }
    .lids   { fill: none; stroke: #2A1A12; stroke-width: 3.4; stroke-linecap: round; }
    .stalk  { stroke: #F0A183; stroke-width: 5; stroke-linecap: round; fill: none; }
    .beacon { fill: #F0A183; }
    .page   { fill: #FFF6F1; stroke: #C98A6D; stroke-width: 2; }
    .line   { fill: #C98A6D; opacity: .3; }
    .wave   { fill: none; stroke: #F0A183; stroke-width: 2.6; stroke-linecap: round; opacity: 0; }
    .shadow { fill: #F0A183; opacity: .45; }
    .dim    { fill: #6E625B; }
    .dimst  { stroke: #5E534C; stroke-width: 5; stroke-linecap: round; fill: none; }
    .dimbe  { fill: #5E534C; }
    .cross  { fill: none; stroke: #2A211C; stroke-width: 3.2; stroke-linecap: round; }
    .mug    { fill: #FFF6F1; stroke: #C98A6D; stroke-width: 2; stroke-linejoin: round; }
    .handle { fill: none; stroke: #C98A6D; stroke-width: 2.4; stroke-linecap: round; }
    .brew   { fill: #C98A6D; }
    .steam  { fill: none; stroke: #F0A183; stroke-width: 2.2; stroke-linecap: round; opacity: 0; }
    .z      { fill: #C98A6D; font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; font-weight: 700; }
    .rig    { animation: bob 3.4s ease-in-out infinite; }
    .lid    { transform-box: fill-box; transform-origin: 50% 50%;
              animation: blink 7s ease-in-out infinite; }
    .readp  { animation: read 3.6s ease-in-out infinite; }
    .sweepp { animation: sweep 3.2s ease-in-out infinite; }
    .w1     { animation: ping 2.6s ease-in-out infinite; }
    .w2     { animation: ping 2.6s ease-in-out .34s infinite; }
    .l1     { animation: lit 4.8s ease-in-out infinite; }
    .l2     { animation: lit 4.8s ease-in-out 1.6s infinite; }
    .l3     { animation: lit 4.8s ease-in-out 3.2s infinite; }
    .s1     { animation: steam 3.8s ease-in-out infinite; }
    .s2     { animation: steam 3.8s ease-in-out 1.9s infinite; }
    .z1     { animation: rise 2.8s ease-in-out infinite; }
    .z2     { animation: rise 2.8s ease-in-out .5s infinite; }
    .z3     { animation: rise 2.8s ease-in-out 1s infinite; }
    .drift  { transform-box: fill-box; transform-origin: 50% 100%;
              animation: drift 4.6s ease-in-out infinite; }
    @keyframes bob   { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes blink { 0%, 44%, 50%, 100% { transform: scaleY(1); } 47% { transform: scaleY(.08); } }
    @keyframes read  { 0% { transform: translateX(-2.4px); } 72% { transform: translateX(2.4px); }
                       86%, 100% { transform: translateX(-2.4px); } }
    @keyframes sweep { 0%, 100% { transform: translateX(-3px); } 50% { transform: translateX(3px); } }
    @keyframes ping  { 0%, 100% { opacity: 0; } 12%, 42% { opacity: .85; } 58% { opacity: 0; } }
    @keyframes lit   { 0%, 28% { opacity: .95; } 34%, 100% { opacity: .3; } }
    @keyframes steam { 0% { opacity: 0; transform: translateY(2px); } 30%, 55% { opacity: .7; }
                       100% { opacity: 0; transform: translateY(-6px); } }
    @keyframes rise  { 0% { opacity: 0; transform: translate(0, 4px); } 30%, 70% { opacity: 1; }
                       100% { opacity: 0; transform: translate(4px, -8px); } }
    @keyframes drift { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }

    .ground { fill: #211C19; }
    .edge   { fill: none; stroke: #E8916F; }
    .eyebrow{ fill: #C98A6D; font: 11px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; letter-spacing: 2.6px; }
    .head   { fill: #F2EAE4; font: 700 42px system-ui, -apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; letter-spacing: -1px; }
    .claim  { fill: #E8916F; font: 700 24px system-ui, -apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; letter-spacing: -.3px; }
    .sub    { fill: #A08D80; font: 15px system-ui, -apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
    .tag    { fill: #A08D80; font: 10px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; letter-spacing: 1.6px; }
    .miss   { fill: #2E2622; }
    .missl  { fill: #A08D80; opacity: .28; }
    .hit    { fill: #FFF6F1; stroke: #E8916F; stroke-width: 1.5; }
    .hitl   { fill: #C98A6D; }
    .dot    { fill: #E8916F; }
    .fade0  { stop-color: #211C19; stop-opacity: 1; }
    .fade1  { stop-color: #211C19; stop-opacity: 0; }
    .wire   { fill: none; stroke: #E8916F; stroke-width: 1.6; stroke-dasharray: 4 5;
              animation: march 1.2s linear infinite; }
    .feed   { animation: scroll 18s linear infinite; }
    .scan   { fill: #E8916F; opacity: .10; animation: scan 4.5s ease-in-out infinite; }
    @keyframes scroll { from { transform: translateY(0); } to { transform: translateY(-272px); } }
    @keyframes march  { to { stroke-dashoffset: -18; } }
    @keyframes scan   { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(200px); } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <defs>
    <clipPath id="win"><rect x="680" y="46" width="180" height="254"/></clipPath>
    <linearGradient id="ft" x1="0" y1="0" x2="0" y2="1"><stop class="fade0" offset="0"/><stop class="fade1" offset="1"/></linearGradient>
    <linearGradient id="fb" x1="0" y1="1" x2="0" y2="0"><stop class="fade0" offset="0"/><stop class="fade1" offset="1"/></linearGradient>
  </defs>
  <rect class="ground" width="880" height="340" rx="12"/>
  <rect class="edge" x=".5" y=".5" width="879" height="339" rx="11.5"/>

  <text class="eyebrow" x="48" y="66">PROBE · RESEARCH SCOUT</text>
  <text class="head" x="46" y="124">Stop drowning</text>
  <text class="head" x="46" y="174">in arXiv.</text>
  <text class="claim" x="47" y="222">PROBE marks the target.</text>
  <text class="sub" x="48" y="264">Dexterous-manipulation papers, scouted on a schedule —</text>
  <text class="sub" x="48" y="286">and retold in Korean when you name one.</text>

  <text class="tag" x="690" y="34">ARXIV · cs.RO + cs.LG</text>
  <g clip-path="url(#win)">
