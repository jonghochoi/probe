name: Check commit style

# Validate every commit subject a PR carries against the CLAUDE.md commit
# grammar. PROBE rebase-merges, so each commit lands on main exactly as it was
# written and the PR title lands nowhere — the subjects are what `git log`
# is read through, and the gate holds the style CLAUDE.md calls the most
# drift-prone ("always start the description with an imperative verb").
#
# Merge commits are skipped: a rebase merge replays the branch without them.

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: check-commit-style-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check the PR's commit subjects against CLAUDE.md commit style
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git log --no-merges --format=%s "$BASE..$HEAD" \
            | python3 linters/check-commit-style.py -
