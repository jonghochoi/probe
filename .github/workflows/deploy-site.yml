name: Deploy site

# Build the reading site from analysis/ and publish it to GitHub Pages.
#
# The generated HTML is NOT committed — a page-per-rewrite bot commit on every
# merge would bury the history this repo is read through. The artifact is built
# fresh on each push to main instead.
#
# On a pull request the site is BUILT BUT NOT DEPLOYED, so broken markdown, an
# `analysis_of` mismatch or a new KaTeX failure is caught before it merges.
#
# One-time manual setup, which no workflow file can do for you:
#   Settings → Pages → Source: GitHub Actions

on:
  push:
    branches: [main]
    paths:
      - 'analysis/**'
      - 'site/**'
      - '.github/workflows/deploy-site.yml'
  pull_request:
    paths:
      - 'analysis/**'
      - 'site/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never cancel a deploy in flight — a half-uploaded artifact would leave the
  # published site inconsistent. PR builds are cancellable; they publish nothing.
  group: deploy-site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # On the job so the index step's `if` can read them. Both are empty until
      # an InsForge project exists, which is what makes that step skip.
      INSFORGE_URL: ${{ secrets.INSFORGE_URL }}
      INSFORGE_API_KEY: ${{ secrets.INSFORGE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the landing page orders the corpus by the commit that
          # landed each rewrite, and the default one-commit clone carries none of
          # those. The build reports the shallow clone rather than ordering off
          # it, so `--strict` would fail here instead of publishing a wrong 최근.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: site/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install build dependencies
        run: pip install -r site/requirements.txt

      - name: Install KaTeX and the webfont sources
        # ONE npm call. There is no package.json here, so npm rebuilds the tree
        # from scratch on every invocation and a second `install --no-save`
        # prunes whatever the first one put there — splitting this line silently
        # removes KaTeX and breaks the math render.
        run: |
          npm install --no-save --prefix site/builder \
            katex@0.16.22 pretendard @fontsource/jetbrains-mono

      - name: Cache rendered formulas
        # Formulas are keyed by sha256(tex|display), so a warm cache turns the
        # KaTeX stage into a no-op and a cold one costs a single batched node
        # call, not one per formula.
        uses: actions/cache@v4
        with:
          path: .site-cache
          key: katex-${{ hashFiles('analysis/*.md') }}
          restore-keys: katex-

      - name: Build
        # `PROBE_SEARCH_API` is a repository *variable*, not a secret: it is the
        # public endpoint the published page posts to. Unset, the build emits no
        # semantic script and the site makes no requests at all.
        env:
          PROBE_SEARCH_API: ${{ vars.PROBE_SEARCH_API }}
        run: python3 site/build-site.py --out .site --strict

      - name: Refresh the search index
        # Only from main, and only once the project secrets exist — until then
        # the step skips and the site falls back to its own lexical filter.
        # Chunking is offline; this step is the only one that needs a key.
        if: github.event_name != 'pull_request' && env.INSFORGE_URL != ''
        env:
          # The embeddings go straight to OpenRouter, so the indexer needs its
          # key. Set, it is used as it stands; unset, the indexer asks InsForge
          # to vend one, which only an organisation on a paid plan will do.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python3 site/build-site.py --index .search/index.jsonl
          python3 site/search/indexer.py .search/index.jsonl

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .site

  deploy:
    # Pull requests stop after `build` — they are a gate, not a release.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
