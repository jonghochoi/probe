name: Check analysis meta

# Lint the per-paper 논문 메타 tables PR-time via the index generator's
# --check mode (writes nothing). Catches a missing/malformed title, arXiv
# link, 분석 생성일, or 관련 Pillar row — and a paper dir with no analysis.md
# at all — BEFORE the next manual index refresh would publish them as
# ⚠️ metadata placeholder badges or a 미분류 bucket row.

on:
  pull_request:
    paths:
      - 'analysis/**'
      - 'scripts/refresh-analysis-index.py'
      - '.github/workflows/check-analysis-meta.yml'

permissions:
  contents: read

concurrency:
  group: check-analysis-meta-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check analysis metadata is index-clean
        run: python3 scripts/refresh-analysis-index.py --check
