name: Refresh analysis index

# Regenerate analysis/README.md on demand. This is a MANUAL job: the human
# fires it whenever they want the deep-dive index brought up to date (Actions
# tab → "Run workflow", `gh workflow run refresh-analysis-index.yml`, or the
# github MCP). The old push-on-merge trigger was retired because it stacked a
# `chore(analysis): refresh index` bot commit onto main after every analysis
# merge, cluttering history; batching several merges into one manual run keeps
# the log clean. PR branches and the per-command prompts still never touch the
# generated block (CLAUDE.md "Automatically-maintained indexes").

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-analysis-index
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Regenerate analysis/README.md index
        run: python3 scripts/refresh-analysis-index.py
      - name: Commit and push if changed
        run: |
          if git diff --quiet -- analysis/README.md; then
            echo "index unchanged — nothing to commit."
            exit 0
          fi
          git config user.name  'probe-index-bot'
          git config user.email 'probe-index-bot@users.noreply.github.com'
          git add analysis/README.md
          git commit -m "chore(analysis): refresh index"
          # Retry on race with another push to main.
          for i in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
            sleep $((2 ** i))
          done
          git push origin HEAD:main
