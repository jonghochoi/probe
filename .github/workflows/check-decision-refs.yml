name: Check decision refs

# Verify that every D# decision citation in agent outputs resolves to the
# per-pillar Decision Log (context/P#.md §3) and that explicit `P# / D#` ties
# agree with the pillar that owns the decision (allocation per CLAUDE.md).
# A typo'd or renumbered D# in an analysis/scouting doc is a silent
# provenance break — this gate catches it PR-time.
#
# Lint-only (no auto-fix / bot commit): a wrong decision tie needs human
# judgment (was the D# wrong, or the P#?), unlike mechanical math fixes.

on:
  pull_request:
    paths:
      - 'analysis/**/*.md'
      - 'readable/*.md'
      - 'scouting/**/*.md'
      - 'context/**'
      - 'scripts/check-decision-refs.py'
      - '.github/workflows/check-decision-refs.yml'

permissions:
  contents: read

concurrency:
  group: check-decision-refs-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check decision citations resolve
        run: python3 scripts/check-decision-refs.py
