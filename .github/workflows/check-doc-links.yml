name: Check doc links

# Verify that local path references in the structural index docs resolve, on
# every PR that touches those docs, the prompts, or the linter itself. This
# automates the manual "run a final grep / zero inbound links = orphan" step of
# the CLAUDE.md "When adding a new top-level doc" checklist, catching a dangling
# path reference (a moved/renamed file, an orphaned doc) before it lands on main.
#
# Lint-only (no auto-fix / bot commit): a broken path reference needs human
# judgment to repair, unlike the mechanical math-formatting fixes.

on:
  pull_request:
    paths:
      - 'CLAUDE.md'
      - 'README.md'
      - 'docs/**'
      - 'context/**'
      - 'catalogs/**'
      - '.claude/**'
      - 'scripts/check-doc-links.py'
      - '.github/workflows/check-doc-links.yml'

permissions:
  contents: read

concurrency:
  group: check-doc-links-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check doc path references resolve
        run: python3 scripts/check-doc-links.py
