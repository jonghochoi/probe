# PROBE — manual ad-hoc runner for any single output track.
#
# Scheduled cron currently lives in Claude Code RemoteTrigger
# (https://claude.ai/code/routines), not in this workflow. This file
# exists so that:
#   1. Ad-hoc runs go through the same `concurrency: probe-main-push`
#      group as future scheduled GitHub Actions runs, guaranteeing
#      serialized `git push origin HEAD:main` to prevent the
#      non-fast-forward race described in CLAUDE.md.
#   2. When the cron is migrated off RemoteTrigger onto Actions, the
#      `schedule:` triggers can be added below without re-deriving the
#      concurrency / permissions / checkout / git-identity scaffolding.
#
# To enable: add an `ANTHROPIC_API_KEY` repository secret. Optional:
# `SEMANTIC_SCHOLAR_API_KEY` if your prompts use Semantic Scholar.

name: PROBE

on:
  workflow_dispatch:
    inputs:
      track:
        description: Which prompt to run
        type: choice
        required: true
        options:
          - scouting-P1
          - scouting-P2
          - scouting-P3
          - scouting-P4
          - synthesis-P1
          - synthesis-P2
          - synthesis-P3
          - synthesis-P4
          - pulse-digest
          - paper-analysis
          - paper-reproduction
      paper_id:
        description: arXiv id / slug (only for paper-analysis or paper-reproduction)
        type: string
        required: false

# Serialize every job that may push to `main` — this is the operational
# half of the two-layer race defense (§C-1 of the plan). The in-prompt
# `git pull --rebase origin main` retry is the library-level safety net.
concurrency:
  group: probe-main-push
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main with full history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "probe-bot"
          git config user.email "probe-bot@users.noreply.github.com"

      - name: Resolve prompt path
        id: prompt
        run: |
          echo "path=.claude/prompts/${{ inputs.track }}.md" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code
        uses: anthropics/claude-code-base-action@v1
        with:
          prompt_file: ${{ steps.prompt.outputs.path }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
        env:
          PAPER_ID: ${{ inputs.paper_id }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          TZ: Asia/Seoul
