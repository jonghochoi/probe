name: Check analysis math

# Validate the GitHub-KaTeX math conventions (docs/style.md §5-6) on every PR
# that touches an analysis doc, and auto-fix what is safely fixable. This runs
# PR-time (not post-merge like the index refresh) so malformed math is caught
# and cleaned BEFORE it lands on main and leaks the source on github.com.
#
# Two jobs:
#   autofix — same-repo branches only (fork PRs get a read-only token): run the
#             checker with --fix (tolerating a non-zero exit — unfixable
#             findings must not abort the job before the fixes are pushed),
#             push the normalized result back to the PR branch as a bot commit,
#             then re-run without --fix so any unfixable finding (unbalanced
#             `$`, unsupported macro) fails the check. The final re-check step
#             owns the pass/fail verdict; the bot push does NOT retrigger the
#             workflow (GITHUB_TOKEN pushes never start new runs).
#   check   — fork PRs only: the same lint read-only (no fix, no push), so an
#             external PR still cannot land source-leaking math unchecked.

on:
  pull_request:
    paths:
      - 'analysis/**/*.md'
      - 'scripts/check-analysis-math.py'
      - '.github/workflows/check-analysis-math.yml'

permissions:
  contents: read

concurrency:
  group: check-analysis-math-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  autofix:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Auto-fix math formatting
        # The script exits 1 when unfixable issues remain even in --fix mode;
        # tolerate that here so the fixes it DID write still get committed and
        # pushed. The trailing "Re-check" step owns the pass/fail verdict.
        run: python3 scripts/check-analysis-math.py --fix || true
      - name: Commit and push fixes if changed
        run: |
          if git diff --quiet; then
            echo "No math formatting fixes needed."
            exit 0
          fi
          git config user.name  'probe-math-bot'
          git config user.email 'probe-math-bot@users.noreply.github.com'
          git add -A
          git commit -m "style(analysis): auto-fix math formatting"
          # Retry on race with another push to the PR branch.
          for i in 1 2 3 4; do
            if git push origin HEAD:${{ github.head_ref }}; then exit 0; fi
            git pull --rebase origin ${{ github.head_ref }}
            sleep $((2 ** i))
          done
          git push origin HEAD:${{ github.head_ref }}
      - name: Re-check for unfixable issues
        run: python3 scripts/check-analysis-math.py

  check:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check math formatting (read-only)
        run: python3 scripts/check-analysis-math.py
