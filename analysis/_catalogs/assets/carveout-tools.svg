<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" style="max-width:720px;font-family:sans-serif">
<defs><marker id="car" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>.ct{font-size:14px;font-weight:600;fill:#222}.cs{font-size:12px;fill:#555}</style>
<text class="ct" x="24" y="34" style="font-size:17px">처방 도구 ② carve-out — "데이터를 어떻게 다루는가"</text>
<text class="cs" x="24" y="56">정의: action expert가 배포 분포에 과적합 → 일반화 저하 (θ_VLM 불변 → forgetting 아님) · 측정: rollout 성공률 · brittle 전략</text>
<rect x="40" y="78" width="150" height="46" rx="10" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="0.5"/><text class="cs" x="115" y="96" text-anchor="middle">action expert</text><text class="cs" x="115" y="112" text-anchor="middle">θ_VLM 그대로</text>
<line x1="192" y1="101" x2="238" y2="101" stroke="#999" stroke-width="1.5" marker-end="url(#car)"/>
<rect x="240" y="78" width="170" height="46" rx="10" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="0.5"/><text class="cs" x="325" y="96" text-anchor="middle">50-step chunk가 특정</text><text class="cs" x="325" y="112" text-anchor="middle">궤적·brittle 전략 암기</text>
<line x1="412" y1="101" x2="458" y2="101" stroke="#D85A30" stroke-width="2" marker-end="url(#car)"/>
<rect x="460" y="78" width="150" height="46" rx="10" fill="#f4f4f5" stroke="#D85A30" stroke-width="1.5"/><text class="cs" x="535" y="96" text-anchor="middle">분포 shift에서</text><text class="cs" x="535" y="112" text-anchor="middle">일반화 붕괴</text>
<text class="ct" x="24" y="156" fill="#2D6BC4">▼ online rollout 예산 의존도 (낮음 → 높음)</text>
<line x1="40" y1="172" x2="680" y2="172" stroke="#d4d4d8" stroke-width="1"/>
<text class="cs" x="120" y="190" text-anchor="middle">offline 가능</text><text class="cs" x="540" y="190" text-anchor="middle">closed-loop rollout 필수</text>
<rect x="24" y="210" width="218" height="186" rx="12" fill="none" stroke="#1D9E75" stroke-width="0.5"/>
<text class="ct" x="42" y="236">① mix 최적화</text>
<text class="cs" x="42" y="256">언제: 사전/co-training 단계</text>
<text class="cs" x="42" y="274">한 도메인 과적합을 다른</text>
<text class="cs" x="42" y="290">도메인 희생 없이 방지</text>
<text class="cs" x="42" y="312">기법: group DRO 도메인</text>
<text class="cs" x="42" y="328">가중치 최적화</text>
<text class="cs" x="42" y="350">예) Re-Mix: uniform 대비</text>
<text class="cs" x="42" y="366">+38%, 인간선택 대비 +32%</text>
<text class="cs" x="42" y="388" fill="#1D9E75">예산: 낮음 (target task 사전지식 불필요)</text>
<rect x="251" y="210" width="218" height="186" rx="12" fill="none" stroke="#D85A30" stroke-width="0.5"/>
<text class="ct" x="269" y="236">② 데이터 선별 / 영향 추정</text>
<text class="cs" x="269" y="256">어느 demo가 closed-loop</text>
<text class="cs" x="269" y="272">성능에 인과적으로 기여?</text>
<text class="cs" x="269" y="294">CUPID: 영향함수 →</text>
<text class="cs" x="269" y="310">REINFORCE식 추정 (33%&lt;</text>
<text class="cs" x="269" y="326">데이터로 SOTA)</text>
<text class="cs" x="269" y="346">DataMIL: datamodel,</text>
<text class="cs" x="269" y="362">task 성공 직접 최적화</text>
<text class="cs" x="269" y="378">Demo-SCORE: 성공/실패</text>
<text class="cs" x="269" y="393" fill="#D85A30">분류기 · 예산: 높음 (rollout 필수)</text>
<rect x="478" y="210" width="218" height="186" rx="12" fill="none" stroke="#2D6BC4" stroke-width="0.5"/>
<text class="ct" x="496" y="236">③ 정책 분포 확장</text>
<text class="cs" x="496" y="256">brittle의 원인: 분포 support</text>
<text class="cs" x="496" y="272">가 좁음 → support를 넓힘</text>
<text class="cs" x="496" y="294">RISE: 비전문가·실패 demo를</text>
<text class="cs" x="496" y="310">stitch (offline RL)</text>
<text class="cs" x="496" y="330">POIR: OOD 상태에서 expert</text>
<text class="cs" x="496" y="346">분포로 복귀 planning</text>
<text class="cs" x="496" y="366">causal: task-relevant feature</text>
<text class="cs" x="496" y="382">분리, spurious 제거</text>
<text class="cs" x="496" y="393" fill="#C8860A">예산: 중~높음 (방식별 상이)</text>
<rect x="24" y="406" width="218" height="6" rx="3" fill="#1D9E75" opacity="0.35"/>
<rect x="251" y="406" width="218" height="6" rx="3" fill="#D85A30" opacity="0.5"/>
<rect x="478" y="406" width="218" height="6" rx="3" fill="#C8860A" opacity="0.45"/>
<rect x="24" y="432" width="672" height="104" rx="12" fill="none" stroke="#7C5BC4" stroke-width="0.5"/>
<text class="ct" x="42" y="458">⚠ 경계 — 이 평면이 forgetting과 직교하는 이유</text>
<text class="cs" x="42" y="482">· θ_VLM을 한 글자도 안 건드림 → 도구 ①의 경로 개입(A~D)으로는 절대 안 고쳐짐</text>
<text class="cs" x="42" y="502">· CUPID 보고: 사전학습을 키워도 brittle 전략은 자동으로 안 걸러짐 → post-training 데이터 curation 여전히 필요</text>
<text class="cs" x="42" y="522">· 진단 분리 필수: 성공률↓가 forgetting인지 carve-out인지 — 지표①(VQA)이 깨끗하면 carve-out, 흔들리면 forgetting</text>
</svg>
